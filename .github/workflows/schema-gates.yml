# The fifteen schema gates, in CI. Two jobs, because they have two different SUBJECTS.
#
# ⭐ WHY THIS IS A SEPARATE FILE FROM ci.yml, AND WHY IT IS NOT NIGHTLY-ONLY.
#
# The original proposal was "wire the schema gates in nightly", on the grounds that ~232s against a
# 7-8 minute `verify` job roughly doubles CI. Both halves of that were checked and neither held:
#
#   * CI is not serial. As a SEPARATE JOB this runs beside `verify`, so the wall-clock cost is
#     max(verify, schema) and not the sum. Measured locally: database 14s + suite 185s ~= 3.3 min
#     WITH THE IMAGE ALREADY CACHED (⟳ r1 LOW 3, claude — a cold runner also pays the 0.34 GB
#     pull). The real CI figure beat the estimate anyway: the first green run of this job took
#     93s end to end, pull included, while `verify` was still running.
#     against a `verify` job that has taken 5-8 min on its last twelve runs.
#   * The precedent cited (backlog #56) measured a gate being switched off for firing on every
#     DOCS-ONLY commit — noise, not duration. That argues for the path filter below, not for a
#     schedule.
#
# And nightly would be actively wrong for gate 12: it guards REPO CODE, so a nightly red arrives up
# to a day after the push that caused it and lands on whoever pushes next. Attribution is the whole
# value; detaching it is how a gate becomes background noise.
#
# What genuinely belongs on a schedule is the OTHER subject: production drift. Nobody's PR changes
# what is deployed, so there is no push to hang that check on. Hence `prod-drift` below.
#
# ⚠ PATH FILTERS ARE PER-WORKFLOW, NOT PER-JOB — which is the only reason this is not simply a
# second job inside ci.yml. The filter is deliberately COARSE: over-including costs runner minutes,
# while under-including makes the gate SILENTLY NOT RUN on the change that breaks it. Those errors
# are not symmetric, so the list biases wide.
name: Schema gates

# ⚠ THE TWO PATH LISTS ARE DUPLICATED ON PURPOSE, AND IT IS NOT A STYLE CHOICE. GitHub Actions does
# not support YAML anchors in workflow files, so `paths: &x` / `paths: *x` does not expand — it
# fails to parse or silently does the wrong thing. Written once, this would be a filter that works
# in every YAML tool and not in the one that matters.
# THE HAZARD THAT CREATES: if the two lists ever DRIFT, pull requests and pushes to master filter
# differently, and the gate can pass on a PR and then not run at all on merge (or the reverse).
# They are kept adjacent so a one-sided edit is visible in the same screen — which is a convention,
# i.e. weaker than a check. If this ever bites, the fix is a script that asserts the two lists are
# equal, not a sterner comment.
#
# ⛔⛔ UNDER-FIRING IS THE DANGEROUS DIRECTION — it makes the gate SILENTLY NOT RUN on the change
# that breaks it — AND THE FIRST VERSION OF THIS COMMENT GOT IT WRONG WHILE CLAIMING TO HAVE
# MEASURED IT. ⟳ r1 BLOCKING 2 (claude). It said: *"MEASURED: of the files the suite reaches,
# exactly ONE lives outside these globs"* — `docs/backlog.md`. That sentence was the output of a
# check that enumerated paths the gate scripts MENTION IN THEIR SOURCE, and gate 15's subject is not
# mentioned anywhere: it is a TUPLE OF DIRECTORIES THE GATE WALKS AT RUNTIME
# (`check-paid-caller-arrival.PRODUCTION_DIRS`). Five of those six directories, plus `middleware.ts`,
# were outside the filter — so a paid caller could land in `lib/` and this workflow would not run,
# which is the precise scenario `check-schema-gates.sh:246` says the gate exists for.
#
# ⚠ THE LESSON IS THE PREDICATE, NOT THE LIST. "Which files does the suite read?" was answered by
# grepping for path literals — the wrong question twice over: it cannot tell a path the code OPENS
# from one a comment MENTIONS (13 of its 14 hits were prose), and it cannot see a path COMPUTED at
# runtime at all. A filter derived from a gate's DECLARED subject is the only version that holds.
#
# ⚠ STILL TRUE, AND NOW THE ONLY SUCH CASE: `docs/backlog.md` is read by `check-docs.py:297,406,463`
# (gate 6) and is not in this filter. That is not a gap — `ci.yml:109` runs the same script in the
# `verify` job, which has NO path filter.
on:
  pull_request:
    branches: [master]
    paths:
      # gate 15's own subject — `check-paid-caller-arrival.PRODUCTION_DIRS/PRODUCTION_FILES`.
      # ⟳ r1 BLOCKING 2: these six were MISSING, so the money gate lived inside a filter that
      # excluded the code it watches. Measured: one line added under `lib/` alone flips it 0 -> 1.
      - 'lib/**'
      - 'app/**'
      - 'worker/**'
      - 'components/**'
      - 'types/**'
      - 'middleware.ts'
      # ⟳ r1 LOW (codex): gate 15 answers "is this a comment?" with the TypeScript compiler and has
      # no fallback, so `typescript` in package.json is a GATE DEPENDENCY — this workflow's own
      # comments say so. A dependency-only PR could change that surface without running the gate
      # whose correctness rests on it.
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'supabase/**'
      - 'docs/superpowers/specs/2026-08-03-stable-blob-addressing/**'
      - 'docs/superpowers/specs/m4/**'
      - '.github/workflows/schema-gates.yml'
  push:
    branches: [master]
    paths:
      # gate 15's own subject — `check-paid-caller-arrival.PRODUCTION_DIRS/PRODUCTION_FILES`.
      # ⟳ r1 BLOCKING 2: these six were MISSING, so the money gate lived inside a filter that
      # excluded the code it watches. Measured: one line added under `lib/` alone flips it 0 -> 1.
      - 'lib/**'
      - 'app/**'
      - 'worker/**'
      - 'components/**'
      - 'types/**'
      - 'middleware.ts'
      # ⟳ r1 LOW (codex): gate 15 answers "is this a comment?" with the TypeScript compiler and has
      # no fallback, so `typescript` in package.json is a GATE DEPENDENCY — this workflow's own
      # comments say so. A dependency-only PR could change that surface without running the gate
      # whose correctness rests on it.
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'supabase/**'
      - 'docs/superpowers/specs/2026-08-03-stable-blob-addressing/**'
      - 'docs/superpowers/specs/m4/**'
      - '.github/workflows/schema-gates.yml'
  # ✅ ARMED 2026-09-15, AND ONLY AFTER A REAL RUN PASSED — the order matters more than the change.
  # This block spent two days saying the schedule was deliberately NOT armed because `prod-drift`
  # needs `CLAUDE_RO_DATABASE_URL` and that secret did not exist: "a gate that cries wolf nightly is
  # one people learn to scroll past" (backlog #56's measured verdict, portable practice §23), and
  # "not arming an alarm is different from arming one that lies."
  #
  # The secret now exists, and the schedule was armed only after the path was PROVEN rather than
  # assumed. Evidence, in the order it was taken:
  #   1. the credential was read back from `.env.local` and its target verified to be PRODUCTION
  #      (project `uykwcybxqgewmbltroxf`), not the deleted `yps-m14-staging` throwaway;
  #   2. `check-live-schema.py --prod --expect-present` run by hand against it —
  #      "M4 is PRESENT as expected — checked all 161 objects, BY DEFINITION not just by name",
  #      rc=0, and the identity line read `claude_ro@…, read_only=on`;
  #   3. `gh workflow run "Schema gates"` dispatched on master — run 35008676617,
  #      **prod-drift: success**, the first time that job has ever run to a verdict.
  #
  # ⚠ WHAT THIS DOES NOT PROVE, said rather than left implied: a green run today shows the job CAN
  # pass, not that a future red is a real drift. The job still refuses loudly (rc=2, "TREAT THIS AS
  # NOT RUN") if the credential goes missing, so a rotated or revoked secret reads as NOT RUN rather
  # than as "production has not drifted" — which is the property that made arming safe at all.
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC daily
  # Kept alongside the schedule, not replaced by it: `workflow_dispatch` is how the path gets
  # exercised on demand, and is how the evidence above was taken.
  workflow_dispatch:

# ⚠ `github.event_name` IS IN THE KEY, and it is load-bearing — ⟳ r1 MEDIUM 5 (claude). Without it
# one group spans both jobs, and `github.ref` is `refs/heads/master` for a push to master AND for the
# 09:00 cron: whichever starts second CANCELS the first. A merge at 08:59 loses its gate run; a merge
# at 09:01 loses the night's drift check. A cancelled run is neither green nor red — it reports
# nothing, which this repo treats as worse than a failure.
concurrency:
  group: schema-gates-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# ⟳ r1 LOW 4 (claude): declared explicitly rather than inherited. Neither job writes anything to
# GitHub, and an unstated `permissions` takes the repository default, which can be read-write.
permissions:
  contents: read

jobs:
  schema-gates:
    # Not on the schedule: this job's subject is the repo, and the repo has not changed overnight.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ⛔ `node_modules` IS A GATE DEPENDENCY, NOT A CONVENIENCE — measured on this job's first CI
      # run. Gate 15 (`check-paid-caller-arrival.py`) answers "is this line a comment?" with the
      # TYPESCRIPT COMPILER and has NO fallback, because the two hand-written versions before it each
      # shipped a false verdict on the money path (r10 H4, r11 H1). Without an install it exits with
      # `CANNOT RUN — node could not compute comment spans … ERR_MODULE_NOT_FOUND`, which the suite
      # correctly treats as a failure rather than a pass. 14 of 15 gates went green without this step;
      # the fifteenth refused, which is the behaviour that makes the refusal worth having.
      - name: Install node dependencies (gate 15 needs the TypeScript compiler)
        run: npm ci

      - name: Build the schema database from the repo
        run: scripts/ci/start-schema-db.sh m4_schema_gates

      # `M4_PHASE=post` is not a guess: `start-schema-db.sh` applies every migration including 0027
      # and ASSERTS both M4 relations exist before exiting 0. The suite refuses to guess the polarity
      # and exits 2 without it, which is the correct refusal and not something to paper over.
      - name: Fifteen schema gates
        env:
          PGCONTAINER: m4_schema_gates
          M4_PHASE: post
        run: scripts/check-schema-gates.sh

      # ⚠ Docker state outlives a step but not a runner; this is for `act`/self-hosted runs, where a
      # leftover container would make the NEXT run's `docker rm -f` the only thing standing between
      # a stale database and a green suite over it.
      - name: Remove the schema database
        if: always()
        run: docker rm -f m4_schema_gates || true

  prod-drift:
    # ⭐ THE ONE GATE WITH A GENUINELY SCHEDULED SUBJECT. `check-live-schema.py --prod` reads what is
    # actually deployed, over CLAUDE_RO_DATABASE_URL. Production drifts on its own schedule — a
    # migration applied by hand, a platform upgrade — and no pull request corresponds to that, so
    # there is no push to attach the check to. This is what "nightly" was always right about.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ⛔ A MISSING CREDENTIAL IS A FAILURE, NEVER A SKIP. A scheduled job that quietly exits 0
      # because a secret is absent reports "production has not drifted" every night while reading
      # nothing at all — the precise shape this repo calls a gate that cannot run reporting success.
      # If this is red because the secret was never added, the correct fixes are to add it or to
      # remove the schedule. Leaving it red and ignored is the one option that teaches people to
      # ignore a red.
      - name: The credential exists, or this is NOT RUN
        env:
          CLAUDE_RO_DATABASE_URL: ${{ secrets.CLAUDE_RO_DATABASE_URL }}
        run: |
          if [ -z "${CLAUDE_RO_DATABASE_URL:-}" ]; then
            echo "CANNOT RUN — secret CLAUDE_RO_DATABASE_URL is not set on this repository."
            echo "  This job reads PRODUCTION read-only and cannot substitute anything for it."
            echo "  TREAT THIS AS NOT RUN — not as 'production has not drifted'."
            echo "  Fix: add the secret (a read-only role; see the claude_ro recipe), or delete the"
            echo "       schedule from .github/workflows/schema-gates.yml. Do not make it exit 0."
            exit 2
          fi
          echo "✅ credential present"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⛔⛔ `--prod` DOES NOT OPEN A SOCKET FROM PYTHON — ⟳ r1 BLOCKING 1 (claude), and without this
      # step the job could NEVER pass, secret or no secret. `m4_catalog.psql_cmd` builds
      # `docker exec -i -e PGU <container> bash -c 'psql "$PGU" …'`, so even the production path
      # needs a container to run the CLIENT in. With none, it exits 2 with
      # `CANNOT RUN — No such container: supabase_db_…` — the developer's own stack name, which does
      # not exist on a runner. Measured: adding this step changes the failure from "No such
      # container" to a real connection error, i.e. the client path is satisfied and only the URL
      # decides the outcome.
      # ⚠ `--entrypoint sleep` because we want psql, NOT a server: the image would otherwise
      # initialise a database nobody reads, which is 14 seconds spent to be ignored.
      - name: A psql client to reach production through
        run: |
          docker run -d --name m4_prod_client \
            --entrypoint sleep public.ecr.aws/supabase/postgres:17.6.1.147 infinity
          docker exec -i m4_prod_client psql --version

      - name: Has production drifted from the manifest?
        env:
          CLAUDE_RO_DATABASE_URL: ${{ secrets.CLAUDE_RO_DATABASE_URL }}
          PGCONTAINER: m4_prod_client
        run: python3 scripts/check-live-schema.py --prod --expect-present

      - name: Remove the psql client
        if: always()
        run: docker rm -f m4_prod_client || true
