# The fifteen schema gates, in CI. Two jobs, because they have two different SUBJECTS.
#
# ⭐ WHY THIS IS A SEPARATE FILE FROM ci.yml, AND WHY IT IS NOT NIGHTLY-ONLY.
#
# The original proposal was "wire the schema gates in nightly", on the grounds that ~232s against a
# 7-8 minute `verify` job roughly doubles CI. Both halves of that were checked and neither held:
#
#   * CI is not serial. As a SEPARATE JOB this runs beside `verify`, so the wall-clock cost is
#     max(verify, schema) and not the sum. Measured locally: database 14s + suite 185s ~= 3.3 min
#     WITH THE IMAGE ALREADY CACHED (⟳ r1 LOW 3, claude — a cold runner also pays the 0.34 GB
#     pull). The real CI figure beat the estimate anyway: the first green run of this job took
#     93s end to end, pull included, while `verify` was still running.
#     against a `verify` job that has taken 5-8 min on its last twelve runs.
#   * The precedent cited (backlog #56) measured a gate being switched off for firing on every
#     DOCS-ONLY commit — noise, not duration. That argues for the path filter below, not for a
#     schedule.
#
# And nightly would be actively wrong for gate 12: it guards REPO CODE, so a nightly red arrives up
# to a day after the push that caused it and lands on whoever pushes next. Attribution is the whole
# value; detaching it is how a gate becomes background noise.
#
# What genuinely belongs on a schedule is the OTHER subject: production drift. Nobody's PR changes
# what is deployed, so there is no push to hang that check on. Hence `prod-drift` below.
#
# ⟳ 2026-09-16, backlog #137: THE PATH FILTER IS GONE — this workflow now runs on EVERY pull request
# to master. The reason it was separate from ci.yml ("path filters are per-workflow, not per-job")
# no longer applies to anything, so folding it in is now a live option; it was NOT taken, because
# `verify` is the one required check and restructuring it to fix an unrelated gate is how a green
# gate becomes a blocked repository. See the block below `name:` for why the filter went.
name: Schema gates

# ⭐⭐ WHY THERE IS NO `paths:` FILTER HERE ANY MORE — backlog #137, 2026-09-16. THE FILTER WAS NOT
# REMOVED TO SAVE EFFORT; IT WAS REMOVED BECAUSE IT MADE THIS GATE UNENFORCEABLE.
#
# THE DEFECT IT CAUSED. `schema-gates` was not in `required_status_checks.contexts` — measured live,
# that list was `["verify"]`, one entry — so the fifteen gates could report RED and the merge button
# stayed green. Nothing consumed their answer. The one-line fix (add the context) WAS A TRAP: a
# workflow-level `paths:` filter means the workflow never STARTS on a docs-only PR, so the context
# never appears, and a *required* check that never reports leaves the pull request PENDING FOREVER —
# not failed, pending. PR #314 demonstrated it live: two files under `docs/`, exactly one check.
# So the filter had to go before the context could be required. The order is load-bearing in the
# other direction too: requiring the context BEFORE this change blocks every docs-only PR.
#
# WHAT THE FILTER WAS PROTECTING, MEASURED RATHER THAN ASSUMED — and the answer is NOTHING:
#   * this job runs in a SEPARATE WORKFLOW, beside `verify`, on its own runner. Ten paired runs
#     (same trigger, same second): schema-gates 98-187s, median ~110s; `verify` 121-604s, median
#     ~516s. schema-gates finished FIRST in all ten. It is never the long pole, so the filter could
#     never save a human a single second of waiting.
#   * `ci.yml` has NO path filter, so `verify` runs on docs-only PRs anyway. On PR #314 the author
#     waited 8m37s for it. A ~110s parallel job makes them wait 8m37s.
#   * 13 of the last 40 first-parent commits on master touch none of the old globs — all docs-only,
#     2-4 files, mostly backlog filings. So ~24 extra runner-MINUTES per 40 merges, and this
#     repository is PUBLIC, where Actions minutes are free.
# ⚠ THE COST THAT IS REAL, STATED RATHER THAN BURIED: once this context is required, an
# INFRASTRUCTURE failure here — the 0.34 GB Postgres image pull, `npm ci`, docker — blocks a
# docs-only PR that has nothing to do with schema. Reliability was 54 success / 0 failure /
# 6 cancelled over the last 60 runs, but ⚠ that record was earned on a population that EXCLUDED
# docs-only PRs by construction, so it is evidence and not proof. The job's verdict does not depend
# on the diff for the SCHEMA gates (they rebuild the same database from the same migrations).
# ⛔⛔ BUT THAT SENTENCE USED TO CLAIM IT OF THE WHOLE JOB, AND THAT WAS FALSE — r1 Medium 10
# (claude), filed then and left open for two rounds because a coordinator note wrongly said
# this file had produced ZERO findings. RE-MEASURED 2026-09-16: gates 3, 6 and 15 DO read the
# diff's subject, and gate 6 has ZERO SLACK — `check-docs.py`'s LINE_BUDGETS put
# `docs/dev-process.md` at 220/220 and `docs/plugins.md` at 260/260 TODAY. Appending ONE line
# to either turns this job RED on a docs-only pull request; measured by doing it, rc=1,
# `221 / 220 OVER`.
# ⭐ THAT IS THE FEATURE, NOT A TRAP, and it is worth saying which: a docs-only PR that pushes
# a budgeted file over its limit SHOULD be blocked. Today that red is simply ignored, which is
# the whole of backlog #137. Once the context is required it stops being ignorable — so the
# first person to hit it will be looking at a correct refusal, and should move detail out of
# the file rather than raise the budget (`check-docs.py` says so in its own message).
#
# ⛔ AND THE FILTER HAD A SECOND CONSUMER THAT WAS NOT AN OPTIMISATION — this is the part that made
# the change bigger than a deletion, and it must not be rebuilt by accident. `check-review-recorded`
# READ the `docs/` globs out of this file as the AUTHORITY for which `docs/` directories hold
# executable gate code rather than prose (two do: gates 1-2 and 10/14 live under `docs/`). Deleting
# the globs made it exit rc=2 CANNOT RUN — correctly, since a zero over nothing is not a pass.
# ⚠ DO NOT SOLVE THAT BY LEAVING A DECORATIVE PATH LIST HERE FOR IT TO READ. A trigger filter is
# under constant corrective pressure (get it wrong and the gate does not run, so someone notices);
# a list that nothing enforces drifts silently forever, which is strictly worse than either option.
# The falsifier now derives those directories from the scripts that actually EXECUTE the files —
# `check-schema-gates.sh` `SPEC=`, `check-anon-exposure.py` `MANIFEST=`, `run-schema-assertions.sh`
# `SEED=` — i.e. from the authority instead of from a proxy for it.
#
# ⚠ WHAT IS LOST, SAID PLAINLY. Two things, and the second was filed in r1 and left open for two
# rounds:
#   1. the log no longer distinguishes "this PR could not have broken a gate" from "the gates
#      passed". Both now read as green. That signal was worth less than the enforceability it
#      was costing.
#   2. ⟳ r1 LOW 14 (claude): the `push:` trigger has no filter either, so a DOCS-ONLY merge to
#      master now starts a run that can CANCEL a code merge's run — the `concurrency` group
#      keys on `github.event_name` and `github.ref`, which are identical for both. Before, a
#      docs-only push did not start one at all. A cancelled run reports nothing, which this
#      repo treats as worse than a failure. Narrow today (merges are serialised by review),
#      and the honest mitigation if it ever bites is `cancel-in-progress: false` on the push
#      path, NOT restoring the filter — that would re-open the defect this branch closed.
#
# ⟳ THE HISTORY THIS REPLACES IS KEPT, because it is the reason nobody should re-introduce the
# filter casually. The list was WRONG ONCE, in the silent direction: r1 BLOCKING 2 found `lib/`,
# `app/`, `worker/`, `components/`, `types/` and `middleware.ts` MISSING — gate 15's own runtime
# subject (`check-paid-caller-arrival.PRODUCTION_DIRS`) — so a paid caller could land in `lib/` and
# this workflow would not run, the precise scenario `check-schema-gates.sh:246` says gate 15 exists
# for. The lesson recorded then was THE PREDICATE, NOT THE LIST: "which files does the suite read?"
# had been answered by grepping path literals, which cannot tell a path the code OPENS from one a
# comment MENTIONS (13 of its 14 hits were prose) and cannot see a path COMPUTED at runtime at all.
# ⚠ A YAML `paths:` block can never have a `--self-test`, so that list was correct only by
# inspection, re-verified whenever someone thought to, with nothing able to report when it stopped
# being correct. Deleting it removes the only copy that could drift.
# ⟳ Also gone with it: the DUPLICATED pull_request/push lists. GitHub Actions does not expand YAML
# anchors, so the two could only be kept in step by convention — a hazard this file documented
# against itself ("the gate can pass on a PR and then not run at all on merge, or the reverse").
# One trigger pair with no lists cannot drift.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # ✅ ARMED 2026-09-15, AND ONLY AFTER A REAL RUN PASSED — the order matters more than the change.
  # This block spent two days saying the schedule was deliberately NOT armed because `prod-drift`
  # needs `CLAUDE_RO_DATABASE_URL` and that secret did not exist: "a gate that cries wolf nightly is
  # one people learn to scroll past" (backlog #56's measured verdict, portable practice §23), and
  # "not arming an alarm is different from arming one that lies."
  #
  # The secret now exists, and the schedule was armed only after the path was PROVEN rather than
  # assumed. Evidence, in the order it was taken:
  #   1. the credential was read back from `.env.local` and its target verified to be PRODUCTION
  #      (project `uykwcybxqgewmbltroxf`), not the deleted `yps-m14-staging` throwaway;
  #   2. `check-live-schema.py --prod --expect-present` run by hand against it —
  #      "M4 is PRESENT as expected — checked all 161 objects, BY DEFINITION not just by name",
  #      rc=0, and the identity line read `claude_ro@…, read_only=on`;
  #   3. `gh workflow run "Schema gates"` dispatched on master — run 35008676617,
  #      **prod-drift: success**, the first time that job has ever run to a verdict.
  #
  # ⚠ WHAT THIS DOES NOT PROVE, said rather than left implied: a green run today shows the job CAN
  # pass, not that a future red is a real drift. The job still refuses loudly (rc=2, "TREAT THIS AS
  # NOT RUN") if the credential goes missing, so a rotated or revoked secret reads as NOT RUN rather
  # than as "production has not drifted" — which is the property that made arming safe at all.
  #
  # ⛔ THIS SCHEDULE CAN DISARM ITSELF SILENTLY, AND NOTHING HERE WOULD NOTICE — r1 Low. This
  # repository is PUBLIC, and GitHub disables scheduled workflows after 60 days with no repository
  # activity. The line above would still read "armed" while nothing ran. Low today only because
  # this repo sees daily pushes; if that stops being true, the absence of runs is the thing to look
  # for, and absence is exactly what no gate in here can see.
  #
  # ⚠ WHO SEES A RED — chased as a possible High and refuted, so the answer is recorded rather than
  # left to be re-derived. GitHub routes scheduled-workflow failures to the user who last modified
  # the cron syntax, and squash-merges land re-authored as the repository owner, so a nightly red
  # does reach them by email. ⟳ r2 Low: this said the channel was "undocumented", which is an
  # OVERCLAIM and the worst kind to leave in a gate comment — GitHub documents the routing
  # explicitly (Actions → events-that-trigger-workflows → schedule). What is genuinely weak is
  # narrower and survives the correction: the recipient TRANSFERS SILENTLY to whoever next edits
  # this line, and a scheduled failure appears on NO pull request's check list — so nobody meets it
  # while reviewing, which is the only moment anyone is reliably looking.
  #
  # ⚠ A RED IS NOT ALWAYS DRIFT. The nightly compares production against MASTER's manifest, and
  # `manifest <= live` has no accept-list in that direction — so a schema shipped to master but not
  # yet deployed reads the same as production having drifted. Narrow in practice (the manifest is
  # pinned to M4 and additions go through `accepted-additions.txt`) and stated as a hypothesis: the
  # scenario was NOT executed. Read a red as "these differ", never as "someone changed production".
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC daily
  # Kept alongside the schedule, not replaced by it: `workflow_dispatch` is how the path gets
  # exercised on demand, and is how the evidence above was taken.
  workflow_dispatch:

# ⚠ `github.event_name` IS IN THE KEY, and it is load-bearing — ⟳ r1 MEDIUM 5 (claude). Without it
# one group spans both jobs, and `github.ref` is `refs/heads/master` for a push to master AND for the
# 09:00 cron: whichever starts second CANCELS the first. A merge at 08:59 loses its gate run; a merge
# at 09:01 loses the night's drift check. A cancelled run is neither green nor red — it reports
# nothing, which this repo treats as worse than a failure.
concurrency:
  group: schema-gates-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# ⟳ r1 LOW 4 (claude): declared explicitly rather than inherited. Neither job writes anything to
# GitHub, and an unstated `permissions` takes the repository default, which can be read-write.
permissions:
  contents: read

jobs:
  schema-gates:
    # Not on the schedule: this job's subject is the repo, and the repo has not changed overnight.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ⛔ `node_modules` IS A GATE DEPENDENCY, NOT A CONVENIENCE — measured on this job's first CI
      # run. Gate 15 (`check-paid-caller-arrival.py`) answers "is this line a comment?" with the
      # TYPESCRIPT COMPILER and has NO fallback, because the two hand-written versions before it each
      # shipped a false verdict on the money path (r10 H4, r11 H1). Without an install it exits with
      # `CANNOT RUN — node could not compute comment spans … ERR_MODULE_NOT_FOUND`, which the suite
      # correctly treats as a failure rather than a pass. 14 of 15 gates went green without this step;
      # the fifteenth refused, which is the behaviour that makes the refusal worth having.
      - name: Install node dependencies (gate 15 needs the TypeScript compiler)
        run: npm ci

      - name: Build the schema database from the repo
        run: scripts/ci/start-schema-db.sh m4_schema_gates

      # `M4_PHASE=post` is not a guess: `start-schema-db.sh` applies every migration including 0027
      # and ASSERTS both M4 relations exist before exiting 0. The suite refuses to guess the polarity
      # and exits 2 without it, which is the correct refusal and not something to paper over.
      - name: Fifteen schema gates
        env:
          PGCONTAINER: m4_schema_gates
          M4_PHASE: post
        run: scripts/check-schema-gates.sh

      # ⚠ Docker state outlives a step but not a runner; this is for `act`/self-hosted runs, where a
      # leftover container would make the NEXT run's `docker rm -f` the only thing standing between
      # a stale database and a green suite over it.
      - name: Remove the schema database
        if: always()
        run: docker rm -f m4_schema_gates || true

  prod-drift:
    # ⭐ THE ONE GATE WITH A GENUINELY SCHEDULED SUBJECT. `check-live-schema.py --prod` reads what is
    # actually deployed, over CLAUDE_RO_DATABASE_URL. Production drifts on its own schedule — a
    # migration applied by hand, a platform upgrade — and no pull request corresponds to that, so
    # there is no push to attach the check to. This is what "nightly" was always right about.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ⛔ A MISSING CREDENTIAL IS A FAILURE, NEVER A SKIP. A scheduled job that quietly exits 0
      # because a secret is absent reports "production has not drifted" every night while reading
      # nothing at all — the precise shape this repo calls a gate that cannot run reporting success.
      # If this is red because the secret was never added, the correct fixes are to add it or to
      # remove the schedule. Leaving it red and ignored is the one option that teaches people to
      # ignore a red.
      - name: The credential exists, or this is NOT RUN
        env:
          CLAUDE_RO_DATABASE_URL: ${{ secrets.CLAUDE_RO_DATABASE_URL }}
        run: |
          if [ -z "${CLAUDE_RO_DATABASE_URL:-}" ]; then
            echo "CANNOT RUN — secret CLAUDE_RO_DATABASE_URL is not set on this repository."
            echo "  This job reads PRODUCTION read-only and cannot substitute anything for it."
            echo "  TREAT THIS AS NOT RUN — not as 'production has not drifted'."
            echo "  Fix: add the secret (a read-only role; see the claude_ro recipe), or delete the"
            echo "       schedule from .github/workflows/schema-gates.yml. Do not make it exit 0."
            exit 2
          fi
          echo "✅ credential present"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⛔⛔ `--prod` DOES NOT OPEN A SOCKET FROM PYTHON — ⟳ r1 BLOCKING 1 (claude), and without this
      # step the job could NEVER pass, secret or no secret. `m4_catalog.psql_cmd` builds
      # `docker exec -i -e PGU <container> bash -c 'psql "$PGU" …'`, so even the production path
      # needs a container to run the CLIENT in. With none, it exits 2 with
      # `CANNOT RUN — No such container: supabase_db_…` — the developer's own stack name, which does
      # not exist on a runner. Measured: adding this step changes the failure from "No such
      # container" to a real connection error, i.e. the client path is satisfied and only the URL
      # decides the outcome.
      # ⚠ `--entrypoint sleep` because we want psql, NOT a server: the image would otherwise
      # initialise a database nobody reads, which is 14 seconds spent to be ignored.
      - name: A psql client to reach production through
        run: |
          docker run -d --name m4_prod_client \
            --entrypoint sleep public.ecr.aws/supabase/postgres:17.6.1.147 infinity
          docker exec -i m4_prod_client psql --version

      - name: Has production drifted from the manifest?
        env:
          CLAUDE_RO_DATABASE_URL: ${{ secrets.CLAUDE_RO_DATABASE_URL }}
          PGCONTAINER: m4_prod_client
        run: python3 scripts/check-live-schema.py --prod --expect-present

      - name: Remove the psql client
        if: always()
        run: docker rm -f m4_prod_client || true
