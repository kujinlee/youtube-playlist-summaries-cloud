# Turns a PR from "a checkpoint you have to read" into "a gate that already ran".
#
# Runs only what needs no external service:
#   - tsc --noEmit           type errors
#   - npm test               2500+ unit/component tests
#   - check:confinement      static guard: service_role stays out of request paths
#
# NOT here: `npm run test:integration` needs a live Supabase stack (see
# tests/integration/setup.ts) and is forced --runInBand; and `test:e2e` needs
# Playwright browsers + a dev server. Both stay local for now — adding the
# Supabase service container is a follow-up, not a blocker for this gate.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile (node:22-bookworm-slim) so CI runs the
          # production runtime, not whatever is on the dev machine.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npm test -- --ci

      - name: service_role confinement guard
        run: npm run check:confinement
