# Turns a PR from "a checkpoint you have to read" into "a gate that already ran".
#
# Runs only what needs no external service:
#   - tsc --noEmit           type errors
#   - npm test               2500+ unit/component tests
#   - check:confinement      static guard: service_role stays out of request paths
#
# NOT here: `npm run test:integration` needs a live Supabase stack (see
# tests/integration/setup.ts) and is forced --runInBand; and `test:e2e` needs
# Playwright browsers + a dev server. Both stay local for now — adding the
# Supabase service container is a follow-up, not a blocker for this gate.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # ⟳ 2026-10-01: 15 -> 30. NOT a flake and NOT a slow runner — the job was CANCELLED
    # mid-sweep at 15m15s while the ten runs before it finished in 9m46-11m45. This branch
    # adds two SUBPROCESS-HEAVY guards whose suites the mutation sweep re-runs once per
    # mutation. Measured locally: `check-rc-contract --self-test` 29.1s x 15 mutations and
    # `check-surface-recall --self-test` 18.9s x 19 — roughly 13 minutes between them,
    # against a budget set before either guard existed. `check-ratchet-contract` is 0.12s,
    # so the cost is the subprocess probes, not the suite count.
    # ⚠ THIS BUYS HEADROOM, IT DOES NOT FIX THE SHAPE — backlog #217. A timeout raised
    # once is prudence; raised twice it is a budget nobody is keeping, so the row records
    # the measurement and the split that would actually pay it down.
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 is REQUIRED by the dashboard entry ratchet, which diffs
      # `origin/$GITHUB_BASE_REF...HEAD`. actions/checkout takes depth 1 on the synthesised
      # merge ref, so HEAD is a graft with NO MERGE BASE and the ratchet exits 2 —
      # `fatal: origin/master...HEAD: no merge base`, i.e. CANNOT RUN, i.e. NOT CHECKED.
      # An explicit `git fetch` refspec was tried first: it creates origin/master and leaves
      # that same error, because it fixes the symptom a review reported and not the outcome.
      # Measured: full history is ~0.85s and ~3.7MB over 1,398 commits, and nothing else in
      # this workflow reads git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile (node:22-bookworm-slim) so CI runs the
          # production runtime, not whatever is on the dev machine.
          node-version: '22'
          cache: npm

      # ⛔ PYTHON WAS THE ONE RUNTIME THIS JOB DID NOT PIN, AND IT RUNS 45 OF THE GUARDS BELOW.
      # Node is pinned above and has been since this file was written; `python3` was left to whatever
      # the runner image happened to ship, so GitHub could change the behaviour of every guard in the
      # REQUIRED check with no commit, no diff, and nothing to attribute it to.
      #
      # ⚠ THE INSTANCE THAT FOUND IT, because it is the reason this is not theoretical. 2026-09-16,
      # PR #315: CI and a dev machine disagreed on the SAME commit — 723 mutations attributed
      # locally, 722 in CI. `Path.is_file()` raises OSError (ENAMETOOLONG) for an over-long path
      # EXCEPT on Python 3.13+, which widened the errno set it swallows. The dev machine ran 3.14 and
      # returned False; the runner raised, while the case list was still being BUILT, so the suite
      # went red with no `[FAIL]` line and the kill could not be attributed to any case.
      #
      # ⚠ 3.12 IS NOT A PREFERENCE — it is what this job was ALREADY running, so pinning changes no
      # behaviour today. It only stops the behaviour changing without a commit. `prod-drift` in
      # schema-gates.yml has pinned the same version since it was written; this makes the repository
      # consistent rather than introducing a new opinion.
      # `scripts/check-python-pin.py` asserts the pin actually TOOK EFFECT here, and tells a
      # developer when their local interpreter differs from it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tests/lib/dig/slide-crop.integration.test.ts shells out to real ffmpeg/ffprobe
      # (lib/dig/slide-crop.ts) and has no skip-gate, so `npm test` is not hermetic —
      # it passes on a dev Mac with ffmpeg installed and fails anywhere else. Installing
      # it here FIXES the suite rather than normalising a known-red test into a skip.
      #
      # ⚠ UPDATE FROM THE UBUNTU ARCHIVE ONLY — `apt-get update` exits 100 if ANY configured
      # index fails, and the runner image ships third-party source lists in
      # /etc/apt/sources.list.d/ that this repo does not use (Google Chrome, Microsoft).
      # A bare `apt-get update` therefore made the WHOLE gate — every check, master included —
      # share fate with a mirror this project has no relationship with.
      # MEASURED 2026-09-09: a `Hash Sum mismatch` on
      # dl.google.com/linux/chrome-stable/deb/dists/stable/main/binary-amd64/Packages.gz
      # failed this step on PR #272 AND, minutes later, on 3afe62c0 — an already-merged master
      # commit that had gone green three hours earlier. Same step, same URL, both before a
      # single line of repo code ran: CANNOT RUN, not a verdict on either subject.
      # Grepped the same day: `google-chrome` / `dl.google.com` appear NOWHERE in this repo,
      # and Playwright is not installed in CI, so nothing here installs from those sources.
      # sourceparts="-" disables the whole sources.list.d directory for this one command;
      # List-Cleanup=0 stops apt discarding cached lists for the sources it was not shown.
      # This does NOT weaken the gate: if ffmpeg is genuinely unavailable the install still
      # fails loudly, and the two binaries are then executed — apt reporting "installed" is a
      # claim about the package, not proof that the thing the tests shell out to will run.
      - name: Install ffmpeg (required by the slide-crop tests)
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null

      # ⛔ FIRST, because every guard below runs on this interpreter. If the pin did not take
      # effect, their results are not evidence about anything — and a `setup-python` step that is
      # present but ineffective is the shape that produces a confident, meaningless green.
      - name: The Python pin took effect
        run: python3 scripts/check-python-pin.py

      - name: check-python-pin self-test
        run: python3 scripts/check-python-pin.py --self-test

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # --json --outputFile is what makes the counts MEASURABLE rather than asserted: the next step
      # compares the roadmap's stated numbers against this file. Without it, the roadmap's
      # "2703 unit / 267 suites" is a claim nobody re-reads, and it had already drifted to 2690.
      - name: Unit and component tests
        run: npm test -- --ci --json --outputFile=jest-results.json

      # The roadmap states the size of the safety net. This makes that statement fail when it drifts.
      # Deliberately AFTER the suite and reading its real output — a counts check that cannot see the
      # run is a green tick over nothing, so scripts/check-test-counts.py exits non-zero when the
      # results file is absent, malformed, or reports a failed run.
      - name: Roadmap test counts match the suite
        run: python3 scripts/check-test-counts.py --results jest-results.json

      - name: check-test-counts self-test
        run: python3 scripts/check-test-counts.py --self-test

      - name: service_role confinement guard
        run: npm run check:confinement

      # ADR index drift, dangling ADR references, broken living-doc links.
      # Also prints an advisory list of spec decisions never promoted to an ADR.
      - name: Documentation integrity
        run: python3 scripts/check-docs.py

      # backlog #98 — the INVERTED direction. Every other rule about a backlog row compares the
      # row to ITSELF (severity marker vs status cell), so a row that is stale agrees with itself
      # perfectly and disagrees only with GIT. Five instances shipped that way; none was caught by
      # a machine. This one reads merged commit subjects and asks whether the rows they close say
      # so. WARN-ONLY — exit 0 with findings printed — because backlog #56 measured that a
      # blocking gate on a docs-only mismatch is the thing that gets switched off. It exits 2 only
      # on CANNOT RUN (shallow clone, no git, zero closing tokens), which is a real failure.
      # ⚠ Its findings live in THIS log; that is the warn-only mitigation, so do not silence it.
      - name: Backlog rows vs merged commits (warn-only, backlog #98)
        run: python3 scripts/check-backlog-closure.py

      - name: check-backlog-closure self-test
        run: python3 scripts/check-backlog-closure.py --self-test

      # ⛔ brief-compose is a COMPOSER, not a `check-*`, so `check-ratchet-contract`'s population
      # (30 guards, all check-*) does not see it — yet it carries the half-live-toggle guard from
      # backlog #102. Measured 2026-09-10 during the r1 review (finding F9): 62 cases, no CI step,
      # no mutation manifest. A guard nothing runs is the class that froze the backlog page for
      # five days.
      - name: check-review-recorded self-test
        run: python3 scripts/check-review-recorded.py --self-test

      # backlog #258: the claim-finder. This step is also its R3 caller — without an executor
      # `check-ratchet-contract.py` counts it as a guard nothing runs, which is the class that
      # froze the backlog page for five days.
      - name: find-claim self-test
        run: python3 scripts/find-claim.py --self-test

      - name: brief-compose self-test
        run: python3 scripts/brief-compose.py --self-test

      # Ratchet on the 2026-07-30 architecture-review findings. Reports progress toward
      # each target; FAILS only when a metric gets worse than its baseline.
      #
      # This is the only thing that would notice finding #1 growing from 12 forked route
      # files to 15 — no test fails and no type breaks when a 13th route copy-pastes the
      # STORAGE_BACKEND branch. Criteria: docs/reviews/architecture-findings-acceptance.md
      - name: Architecture findings ratchet
        run: python3 scripts/check-arch-findings.py

      # Ratchet on gate items that never say what would FAIL them.
      #
      # M1.4's B5 asked a STATIC script to "pass against the real deployed environment" — it has no
      # env, no fetch, no network, so it emitted identical output everywhere and could only ever
      # pass. A guard that passes in both worlds, except the guard was a SENTENCE, which is why
      # every other instrument here missed it: they all inspect code, none inspects a gate.
      #
      # Ratchet, not a hard gate: 13 existing items lack a `FAILS IF:` clause and a big-bang
      # failure would just get switched off. This stops the NEXT one.
      - name: Gate falsifiability ratchet
        run: python3 scripts/check-gate-falsifiability.py

      # The roadmap's ▶ NEXT ACTIONS block must not name work whose checkbox is already ticked.
      # Three occurrences: it called M1.3 "the single remaining blocker" for nine days after M1.3
      # was ticked (2026-07-30), then named the B-group as the next step in the same commit range
      # that closed them (2026-08-11). Both times the file was actively maintained — which is why
      # the recency check originally proposed for this was rejected: it reads green throughout.
      # dev-process.md:102 already requires the tick and the summary to ship together; a rule broken
      # twice by people who know it is a rule that wants to be a script.
      - name: Roadmap internal consistency
        run: python3 scripts/check-roadmap-consistency.py

      # A review round has two halves, or a written reason why it does not. `docs/plugins.md` has
      # required both since June; nothing enforced it, and on 2026-08-24 the M4 plan went two rounds
      # with only the Codex half. It does NOT block when a reviewer genuinely cannot run — the
      # documented fallback already writes a review plus a recorded gap, which is what this asserts.
      - name: Review rounds have both halves
        run: python3 scripts/check-review-rounds.py

      - name: check-review-rounds self-test
        run: python3 scripts/check-review-rounds.py --self-test

      # A feature's documents must say which GOAL they belong to, by a name that survives a rename.
      # Written after an hour was lost re-deriving a roadmap that existed: the feature spans three
      # vocabularies after two honest renames, and membership by keyword returns 7 of 162 specs and
      # plans while missing one the roadmap names in its own fifth line. A convention would catch
      # what someone reads; this catches what is there (ADR-0010).
      - name: Anchor headers
        run: python3 scripts/check-anchors.py

      - name: check-anchors self-test
        run: python3 scripts/check-anchors.py --self-test

      # The memory corpus moved into docs/memory/ on 2026-09-30 (backlog #194) so teammates could
      # obtain it — 146 files, measured at 86% project-or-craft knowledge against 14% personal
      # preference, previously readable on ONE machine with no remote. The harness still reads a
      # DERIVED path, so scripts/bootstrap-memory.sh symlinks it at the repo. ⛔ The failure this
      # catches is SILENT: with no symlink the harness creates a fresh empty directory and every
      # recall reads a corpus of zero entries, so "nothing fires" and "there is no corpus" become
      # indistinguishable. On a CI runner the link is legitimately absent, which the guard reports
      # as an advisory rc=0 — what fails here is a link pointing somewhere WRONG.
      - name: Memory corpus link
        run: python3 scripts/check-memory-link.py

      - name: check-memory-link self-test
        run: python3 scripts/check-memory-link.py --self-test

      # ⛔ THE ONLY GATE THAT READS BOTH SIDES OF THE MATCHER/HOOK SEAM, and it exists because two
      # LIVE defects lived there with 188 self-test cases and 91 mutations on the python side alone
      # (backlog #201, #202). The matcher defines the exit codes; `.claude/hooks/surface-recall.sh`
      # interprets them; nothing reconciled the two lists, and the hook is outside every other
      # guard's population — `check-ratchet-contract`'s is `scripts/check-*.py`, so it cannot see a
      # `.sh` file at all.
      - name: rc contract — the matcher and its hook agree
        run: python3 scripts/check-rc-contract.py

      - name: check-rc-contract self-test
        run: python3 scripts/check-rc-contract.py --self-test

      # ⟳ 2026-10-01, backlog #196 — THE HOOK'S OWN GUARD, and this step is its CALLER.
      # `.claude/hooks/surface-recall.sh` had no self-test, no mutation entry and no reader, which
      # is why both live defects (#201, #202) survived 188 green cases on the python side. It runs
      # the REAL hook in THIS repo through the one `RECALL_MATCHER` seam, so unlike the staged-tree
      # observer it replaced there is no fabricated world to be unfaithful (round 7 B2).
      - name: Reader sentences the hook actually renders
        run: python3 scripts/check-surface-recall.py

      - name: Reader sentences guard self-test
        run: python3 scripts/check-surface-recall.py --self-test

      # The feature tree behind /features, which answers "what does this system do, and what does
      # it deliberately not do". The page is DERIVED from docs/features.md, so the tree is the only
      # hand-written surface and the only place it can rot. Two rules carry the weight: every node
      # marked `built` must name a fragment that exists — named locally, but existence is checked
      # cross-file — and every backlog area and registry anchor must be claimed by exactly ONE
      # node, cross-file throughout. Unclaimed is the dangerous direction: a backlog area no node
      # claims has rows that can never appear on the page, which reads as "no known gaps" rather
      # than as a gap in the map. The tree's own prose is bounded too — a `for:` line says what a
      # node is FOR, and a status token in it is a second copy of what the links already say.
      - name: Feature map
        run: python3 scripts/check-features.py

      - name: check-features self-test
        run: python3 scripts/check-features.py --self-test

      # The ratchets' own contract, enforced rather than described. Written because the prose in
      # docs/process-checklists.md said "there are three ratchets" — from memory, and wrong by half;
      # this script found six. It checks the two rules that are statically decidable (a --self-test
      # exists; no `except` handler returns 0) and states plainly that it does not check the rest.
      - name: Ratchet contract
        run: python3 scripts/check-ratchet-contract.py

      # ⚠ THE THREE GUARDS THAT NOTHING EXECUTED, wired 2026-08-30 by Phase 6.
      # Each was on disk, each had a --self-test, each exits 0 — and no CI step,
      # gate script or hook ran any of them. `check-producer-enumeration.py` was
      # additionally listed in docs/dev-process.md under the heading "What is
      # mechanically enforced". They are steps rather than one combined command
      # so a failure names the guard that failed.
      #
      # This is the R3 arm of the ratchet contract closing on itself: the step
      # above now REFUSES a guard with no caller, so removing any line below
      # turns that step red rather than quietly shrinking coverage.
      - name: Explainer delivery is described in ONE place
        run: python3 scripts/check-explainer-delivery.py

      - name: Plan task order
        run: python3 scripts/check-plan-task-order.py

      # Plan mode was RETIRED 2026-09-08. check-plan-code.py was the only reader those tags
      # ever had, and CI runs it as `--mutate .` / `--self-test` only — so without this step
      # a document could start embedding code again and nothing would notice.
      - name: No document embeds code through a retired plan-mode tag
        run: python3 scripts/check-plan-file-tags.py

      - name: check-plan-file-tags self-test
        run: python3 scripts/check-plan-file-tags.py --self-test

      # ⚠ TWO MORE GUARDS CI COULD NOT SEE — Phase 6 architecture review #7, finding 4.
      # Their only automated caller was scripts/check-schema-gates.sh (gates 3/15 and 5/15),
      # itself referenced zero times here.
      #
      # ⟳ CORRECTED 2026-09-04, BY THIS WORKFLOW GOING RED. The first version of this block ran
      # the guards' BARE ENTRY POINTS and claimed "neither needs a database". That claim was
      # FALSE and the claim's own evidence was taken on a machine with a Supabase container
      # running. Both import `read_catalog` from m4_base_db, which shells out to the
      # `supabase_db_*` container; with no container it exits 2 CANNOT RUN, which is exactly
      # what happened here:
      #     CANNOT RUN — could not read the catalog from 'postgres'. TREAT THIS AS NOT RUN.
      #     Error response from daemon: No such container: supabase_db_...
      #
      # This repo already records the opposite half of this mistake — three ratchets went eight
      # days untestable because their ENTRY POINT needed docker and that was read as the LOGIC
      # needing a DB. This was the mirror: the logic is genuinely pure
      # (check-vocabulary-collisions.py:125 "PURE — catalog rows in ... No database"), and that
      # was read as the entry point being pure too.
      #
      # So CI runs the SELF-TESTS, which exercise the pure rules and need nothing. The full
      # catalog-reading run stays in check-schema-gates.sh where a database exists. This buys
      # real coverage of the RULES — which was the actual gap — and does not pretend to cover
      # the fetch.
      - name: check-guard-coverage self-test (rules only; the full run needs a live catalog)
        run: python3 scripts/check-guard-coverage.py --self-test

      - name: check-vocabulary-collisions self-test (rules only; full run needs a live catalog)
        run: python3 scripts/check-vocabulary-collisions.py --self-test

      # The warn-only banner detector (task #224 residue). Its --self-test runs here;
      # the DETECTOR itself is a Stop hook and has no CI role by design — it observes a
      # session, which CI does not have. Stated so nobody reads this line as coverage of
      # the hook's live behaviour.
      - name: check-banner-armed self-test
        run: python3 scripts/check-banner-armed.py --self-test

      - name: begin-plan self-test
        run: python3 scripts/begin-plan.py --self-test

      # Backlog #79. The two existing contrast guards each own ONE stylesheet; the page the reader
      # opens is composed from three files, so a token supplied by a different file is invisible to
      # both. This one measures coverage rather than ratio — whether the light palette declares
      # every name the OS-dark shim supplies — because the failure mode is a colour that silently
      # is not there, and a ratio check needs both colours to measure anything.
      - name: Theme token coverage (light palette vs the OS-dark shim)
        run: python3 scripts/check-theme-token-coverage.py

      - name: Theme token coverage self-test
        run: python3 scripts/check-theme-token-coverage.py --self-test
      # Backlog #69. A `--self-test` cannot check its own declared case count — doing so means
      # observing its own exit code from inside itself. So this runs each one as a subprocess and
      # compares what it PRINTED with what its docstring DECLARES, the same way
      # check-test-counts.py treats the jest suite. Five of the nine declarations were stale on the
      # first run; it also caught a defect in itself, which is why it is in its own population.
      - name: Declared self-test counts match the suites
        run: python3 scripts/check-selftest-counts.py

      - name: check-selftest-counts self-test
        run: python3 scripts/check-selftest-counts.py --self-test

      # ⛔ SIX ADVERSARIAL ROUNDS ON ONE FILE PRODUCED SIX BLOCKINGS, AND FIVE WERE ONE DEFECT:
      # every case passed the SAME value for the parameter that decided the clause under test, so
      # nothing could tell that parameter from a constant. Each round fixed the axis the previous
      # round had been bitten by — the want, then the input's magnitude, then its position, then
      # the two arguments nobody had varied at all. The generator is not any of those axes; it is
      # that the fixtures vary ONE argument. This asks the question mechanically, per parameter.
      - name: Every parameter of a function under test is varied by its cases
        run: python3 scripts/check-fixture-variation.py

      - name: check-fixture-variation self-test
        run: python3 scripts/check-fixture-variation.py --self-test

      # ADR-0014's rule D2. Its sibling above asks whether the cases VARY their inputs; this asks
      # whether any case can point `main()` at a world it built at all. The two are different
      # questions and the ADR was bought by eleven instances of the second: every `main` resolved
      # its world from module globals, so `main` was the one region no case could reach, and the
      # standard repair (extract the rule) acts on the callee and can never empty that region.
      # Ships with 27 of 37 guards PINNED as identity debt — backlog #56's measured verdict is that
      # a gate red from birth gets switched off, so the pin set is the baseline and it reconciles in
      # both directions: paying a debt without removing its pin is itself a finding.
      - name: Every guard's self-test can drive its own main() over a constructed world
        run: python3 scripts/check-main-drivable.py

      - name: check-main-drivable self-test
        run: python3 scripts/check-main-drivable.py --self-test

      # The CI storage fixture (`scripts/ci/storage-service-fixture.sql`) is a MINIMAL stand-in for
      # tables the storage-api service creates and CI does not run. It is safe only while no gate
      # reads `storage.*`. Run HERE rather than only in `schema-gates.yml`, because this job has no
      # path filter and the subject is repo code: a gate can start reading storage in a commit that
      # touches nothing the schema workflow watches.
      - name: No schema gate reads storage.* (the CI fixture stays scaffolding)
        run: python3 scripts/check-storage-independence.py

      - name: check-storage-independence self-test
        run: python3 scripts/check-storage-independence.py --self-test

      # backlog #90's adopted grouping policy. A group on the backlog page is a CLAIM; this
      # refuses one with no falsifier, fewer than two open members, or a member that is not a row.
      - name: Every grouping is a claim with a falsifier
        run: python3 scripts/check-group-claims.py

      - name: check-group-claims self-test
        run: python3 scripts/check-group-claims.py --self-test

      - name: Producer enumeration matches the defining expression
        run: python3 scripts/check-producer-enumeration.py

      # A money guard lives three files away from a grant that does not know it holds it up. The
      # serve path spends on `tryGet -> absent`, which on Supabase means absent OR RLS-denied; it is
      # safe only because the caller already read the markdown from the same folder, and that is
      # evidence about the model ONLY while one grant covers both keys (ADR-0008). A comment in the
      # migration would leave with the edit it should have stopped — so the grant is pinned instead.
      - name: Storage grant pin (ADR-0008)
        run: python3 scripts/check-storage-grant-pin.py

      # Backlog #54 half (a), PREVENTION — after the mechanism that row specifies was MEASURED not
      # to work. PostgreSQL grants EXECUTE on a new function to PUBLIC, and `alter default
      # privileges` CANNOT remove it: stored entries are ADDITIVE to the built-in default (three
      # scratch-database setups, 2026-08-28, all left `=X/postgres` on the created function). So
      # `revoke execute on functions from anon` closes one of two routes and the other cannot be
      # closed at that layer at all — and it would have PASSED on production, whose default ACL
      # happens to carry no PUBLIC entry, while being wrong everywhere else.
      # What actually keeps prod clean is 41 individual `revoke ... from public` statements, one
      # per migration — a convention, i.e. every author remembering. This is the mechanism for it.
      # Static (reads .sql text, no database), which is why it runs here and not with the schema
      # gates.
      - name: Every new public function revokes PUBLIC
        run: python3 scripts/check-function-revokes.py

      - name: check-function-revokes self-test
        run: python3 scripts/check-function-revokes.py --self-test

      # The ONE inline-markdown renderer, shared by all four page generators. It is a
      # library, not a guard, so `check-ratchet-contract.py` neither sees it nor should:
      # its population is glob("check-*.py"). THIS STEP is what stops its --self-test
      # going unrun, and scripts/mutations/page_markup.json is what stops it going
      # vacuous. Backlog #71.
      - name: page_markup self-test
        run: python3 scripts/page_markup.py --self-test

      # The shared page chrome — theme control, provenance stamp, refresh — used by all
      # five page producers. Same shape as page_markup above and for the same reason: a
      # library, not a guard, so `check-ratchet-contract.py` neither sees it nor should.
      # THIS STEP stops its --self-test going unrun; scripts/mutations/page_chrome.json
      # stops it going vacuous, and writing that manifest immediately found two of its
      # cases already were. Backlog #76 and #77.
      - name: page_chrome self-test
        run: python3 scripts/page_chrome.py --self-test

      # ── The project dashboard: the page, its grammar, and the gate that feeds it ──
      #
      # A person who was away reads this page instead of the transcript. It is only worth
      # reading while entries keep being written, which is what the ratchet below enforces.

      - name: gen-dashboard self-test
        run: python3 scripts/gen-dashboard.py --self-test

      - name: check-dashboard-entry self-test
        run: python3 scripts/check-dashboard-entry.py --self-test

      # The mutation manifest runs against the DELIVERED scripts. It replaced a step that
      # required byte-identity between these files and a 3,170-line planning document —
      # backlog #70, retired 2026-08-29 once this existed and both paths were shown green
      # at 43 mutations / 0 survivors on the same tree.
      #
      # ⚠ That 43 is HISTORY — it pins the one-off equivalence demonstration, not the live
      # count, which has since grown (a 44th entry closed a fail-open found in review). For
      # the current number run the step; EXPECTED_MUTATIONS in check-plan-code.py is what
      # actually enforces it. Do not restate a live count here — see ff5857b.
      #
      # What this protects is unchanged from the step it replaces: the mutation evidence
      # describes the code that ships. It is now literally true rather than true-by-copy.
      #
      # ⚠ The coupling is REDUCED, not gone: 1,541 lines of byte-identity become 45 exact
      # source anchors (~3%), which is inherent to anchor-based mutation testing. Measured
      # over PR #175's five commits — +166/-14 lines, zero anchors disturbed.
      #
      # FAILS IF: a mutation survives · an anchor is missing or ambiguous · a suite times
      # out (CANNOT RUN, never a catch) · the control is red before any mutation is applied
      # · a manifest's count differs from EXPECTED_MUTATIONS in EITHER direction (adding a
      #   mutation is also a visible act) · a manifest repeats a mutation name or edit anchor,
      #   which would keep the count while narrowing real coverage.
      #
      # ⟳ 2026-10-05, backlog #217: THE SWEEP ITSELF HAS MOVED to the `mutation-sweep` matrix
      # job at the bottom of this file, which runs it in N parallel shards. It is NOT gone and
      # it is NOT weaker — the whole-manifest checks in that FAILS IF list run in every shard;
      # only the suite runs are split. What is left here is the self-test below.
      # ⛔ THE CONTEXT NAME CHANGED, AND THAT IS A REPO SETTING, NOT A FILE EDIT — see the
      # comment on `mutation-sweep-complete`. Until that setting lands, a red sweep does not
      # block a merge; `verify` no longer carries it.

      # The ratchet runs in CI; until now its own tests did not. Same reason every other
      # ratchet here has a --self-test step: a guard whose tests are developer-machine-only
      # can rot without anything noticing.
      - name: check-plan-code self-test
        run: python3 scripts/check-plan-code.py --self-test

      # The gate itself. Needs the merge base, hence fetch-depth: 0 on the checkout.
      # BODY goes through env and then a FILE — never interpolated into the shell —
      # because a PR body is attacker-controlled text full of backticks and quotes.
      # ⛔ SAME FROZEN-PAYLOAD PROPERTY AS `check-review-recorded` BELOW, and backlog #168 exists
      # because this warning was written on THAT step and not this one. Editing the PR body does
      # not re-arm this gate and `gh run rerun` replays the stale payload — only a new
      # `pull_request` event (a push) picks the edit up. Measured on PR #336, 2026-09-22: the
      # author read this step's refusal, edited the body exactly as instructed, spent a rerun, and
      # found the cause on the sibling's comment. ⭐ The durable fix is in the REFUSAL MESSAGE
      # (`scripts/check-dashboard-entry.py`), which the reader actually sees; this comment is the
      # cheap half, for whoever is editing the workflow rather than reading its output.
      - name: dashboard entry ratchet
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > /tmp/pr-body.md
          python3 scripts/check-dashboard-entry.py \
            --base "origin/$GITHUB_BASE_REF" --pr-body-file /tmp/pr-body.md

      # ⛔ THE ZERO-ROUND CASE. `check-review-rounds` audits rounds that EXIST; a branch with none
      # passes it vacuously, which is how five PRs merged unreviewed on 2026-09-09 with every gate
      # green. Same shape as the sibling above: a branch that changes CODE records a round, or says
      # `NO-REVIEW: <reason>` in the PR body.
      # ⚠ WRITES ITS OWN BODY FILE. The first version read `/tmp/pr-body.md` produced by the
      # dashboard-entry step above — a side effect of a DIFFERENT step, which reordering, removing
      # or short-circuiting that step would turn into a stale or missing read (r1 finding R8).
      # Same `printf '%s' "$BODY"` for the same reason stated there: a PR body is attacker-
      # controlled text full of backticks and quotes.
      # ⛔ EDITING THE PR BODY DOES NOT RE-ARM THIS STEP, AND `gh run rerun` DOES NOT EITHER.
      # `github.event.pull_request.body` is read from the EVENT PAYLOAD, which is frozen when the
      # event fires. A rerun replays that same payload, so a `NO-REVIEW:` declaration added after a
      # red run is invisible to the rerun and the step fails again with an identical message —
      # measured 2026-09-18 on PR #322, where it cost two rerun cycles before the cause was found.
      # Only a NEW `pull_request` event picks up an edited body, i.e. a push (`synchronize`) or a
      # reopen. If you have just edited the body to answer this gate, push something.
      - name: check-review-recorded (PR only)
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > /tmp/review-pr-body.md
          python3 scripts/check-review-recorded.py \
            --base "origin/$GITHUB_BASE_REF" --pr-body-file /tmp/review-pr-body.md


  mutation-sweep:
    # ─────────────────────────────────────────────────────────────────────────────────────
    # THE MUTATION SWEEP, IN SHARDS — backlog #217.
    #
    # ⛔ WHY IT IS NOT A STEP OF `verify` ANY MORE. The sweep re-runs a guard's WHOLE suite
    # once per mutation, so its cost is `mutations x suite_time`. MEASURED on PR #360's
    # branch: one guard (`check-main-drivable.py`) held 183 entries against its own ~30s
    # self-test — ~87 of the ~90 minutes — and the job was KILLED at `timeout-minutes: 30`,
    # a ceiling already raised once from 15. Raising it again is a budget nobody is keeping,
    # which is #217's own stated trigger condition.
    #
    # ⛔ AND WHY A MATRIX ON `verify` WOULD HAVE BEEN WRONG, twice over. A matrix renames the
    # check to `verify (1)`, `verify (2)`, … — and `verify` is THE required context, so
    # renaming it leaves every pull request waiting for a context that will never report
    # (backlog #137, measured live on PR #314). It would also re-run `verify`'s other ~60
    # steps, `npm ci` and the 2,700-test suite included, once per shard.
    #
    # WHAT IS SHARDED AND WHAT IS NOT — only the EXECUTION. The whole-manifest checks (counts
    # against EXPECTED_MUTATIONS in both directions, the duplicate name and anchor refusals,
    # the home-escape scan over every target and every replacement) run in EVERY shard,
    # because N local invariants are not the global one: a shard that validated only its own
    # slice would let coverage shrink with every shard still green.
    #
    # ⚠ EACH SHARD PAYS THE CONTROL RUNS for the files IT mutates, so that cost is repeated
    # across shards rather than divided. Deliberate — a "caught" verdict is empty without a
    # green control for the file it is about. It also means N is not free, and it is why the
    # measured speedup at N=8 is 5.0x (1758s -> 353s) rather than 8x: see the matrix.
    #
    # ⛔⛔ AND THE REPETITION IS NOT ONLY A COST — IT MULTIPLIES THE EXPOSURE OF THE ONE CHECK
    # WHOSE JOB IS TO INVALIDATE A RUN. Round 1's Claude half measured it: 114 control +
    # re-control suite runs unsharded become 822 at N=8 and 1,316 at N=16 — a 7.21x increase.
    # The after-control answers "did the tree change underneath us"; running it 7.21x more often
    # surfaces 7.21x more drift.
    #
    # ⭐ THAT IS NOT WHY THE FIRST CI RUN OF THIS CHANGE WENT RED, and the correction is kept
    # rather than quietly dropped. Shard 1 reported `CANNOT RUN — check-banner-armed.py is no
    # longer green AFTER the sequence` -> NOT MEASURED. The cause was NOT repetition and NOT
    # residue under `.claude/`: it was a BYTECODE CACHE. A mutation of `observer_log.py`
    # ("append truncates instead of appending") compiled to `scripts/__pycache__/*.pyc`, the
    # harness restored the SOURCE and nothing else, and Python validates a cache against the
    # source's (mtime, size) — so inside one mtime tick the stale entry still looked current and
    # the next import got the MUTANT. `check-banner-armed.py` imports `observer_log`.
    # Sharding did not create that race; it made an existing one surface more often, which is
    # the honest reading of the 7.21x.
    #
    # ⛔ THE FIX IS IN `check-plan-code.py`, IN TWO HALVES, AND EITHER ALONE LEAVES A HOLE.
    # `child_env` sets PYTHONDONTWRITEBYTECODE=1 so no suite this harness spawns WRITES a cache;
    # `stage_tree` passes `ignore=shutil.ignore_patterns("__pycache__")` so none is CARRIED IN.
    # Round 2 reproduced the original symptom on the tree that shipped only the first half —
    # `copy2` preserves mtime and size, so the repository's own 89-file cache arrived looking
    # current.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # ⛔ NOT fail-fast. A surviving mutation in shard 3 says nothing about shards 4-8, and
      # cancelling them turns one finding into an unknown — the reader needs every survivor
      # from the first run, not whichever one happened to fail first.
      fail-fast: false
      matrix:
        # ⛔ ONLY THE LENGTH OF THIS LIST MATTERS. The step below takes I from
        # `strategy.job-index` and N from `strategy.job-total`, so the shards are 1..job-total
        # by construction, exactly once each. Writing `/8` by hand beside this list would be
        # one number in two places, and the dangerous direction is SILENT: a list shortened to
        # 4 with the denominator left at 8 runs HALF the manifest and all four shards pass.
        # The values are 1..N only so the GitHub UI reads `mutation-sweep (3)` for the third.
        #
        # WHY 8 — ARITHMETIC OVER MEASURED COSTS, not a guess. Timed on this branch
        # (2026-10-05, 1,193 entries over 57 target files, `/usr/bin/time -p`):
        #
        #   unsharded `--mutate .`          1758s   (29.3 min — the thing being replaced)
        #   one pass over all 57 suites       77s   (a shard pays this TWICE: control +
        #                                            re-control, and it does NOT divide by N)
        #   mutation work                   1606s   (sum of each entry's own suite cost)
        #   shard 1 of 8, measured           353s   (150/150 killed, 150 attributed)
        #
        # So a shard costs ~153s of control plus ~1606/N. The model predicts 1758.8s unsharded
        # against 1758.45s measured, which is why the per-N numbers below are arithmetic rather
        # than extrapolation.
        #
        # ⛔ SIZED AGAINST THE WORST CASE, WHICH IS NOT THIS BRANCH — PR #360's, where the sweep
        # is ~90 min (~5,100s) because one guard holds 183 entries against a ~30s suite. There
        # the control pass is ~107s, so mutation work is ~4,890s and a shard is
        # 214 + 4890/N seconds:
        #
        #   N=4   ~1,436s = 23.9 min   -> 1.25x under the 30-minute ceiling. Not headroom.
        #   N=8     ~825s = 13.8 min   -> 2.2x. Chosen.
        #   N=16    ~519s =  8.7 min   -> 3.5x, but 16 checkouts and 16 `npm ci` runs buy it,
        #                                 and the 214s control floor caps the whole speedup at
        #                                 ~24x however large N gets.
        #
        # ⭐ AND THE BALANCE IS MEASURED, not assumed — this is the crux of round-robin. Per
        # shard predicted work from the same per-suite costs, at N=8: ROUND-ROBIN 325-374s,
        # a 1.15x spread; CONTIGUOUS 27-491s, a 17.9x spread, with the long shard carrying the
        # expensive block alone. At N=16 contiguous reaches 63x. A per-shard mutation COUNT is
        # even either way, which is exactly why counting them proves nothing.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # ⚠ fetch-depth: 0 for parity with `verify`, not because the sweep reads history — it
      # copies the tree into a temp dir with no `.git` at all. Keeping the two checkouts
      # identical means a guard that grows a history-reading case does not fail HERE for a
      # reason that has nothing to do with mutation testing. Measured at ~0.85s.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⚠ NODE AND `npm ci` ARE NOT OPTIONAL HERE, and the reason is one guard:
      # `check-paid-caller-arrival` shells out to `node scripts/ts-comment-spans.mjs`, which
      # imports typescript — the harness stages `node_modules/typescript` for exactly that,
      # and the oracle REFUSES to fall back (deliberately). Without this, 20 of that guard's
      # 32 cases report CANNOT RUN, its control goes red, and the harness correctly refuses
      # the whole run. This is not overhead to trim: it is what lets the shard measure.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The same pin as every other job, which `scripts/check-python-pin.py` requires: every
      # job pins the interpreter or is exempt in writing, and the pins must AGREE.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⛔ FIRST, as in `verify`. If the pin did not take effect, every mutation verdict below
      # is a measurement of an interpreter nobody declared — PR #315 is the instance: CI and a
      # dev machine disagreed about one attribution on the same commit.
      - name: The Python pin took effect
        run: python3 scripts/check-python-pin.py

      - name: Install dependencies
        run: npm ci

      # ⛔ I AND N COME FROM THE MATRIX, AND NOTHING HERE INTERPRETS THEM — ROUND 8 M2.
      # `strategy.job-index` is 0-based and `job-total` is N; both arrive through `env:` and are
      # passed STRAIGHT to `--shard0`, which is 0-based precisely so this file needs no arithmetic.
      #
      # ⚠ THIS PARAGRAPH PREVIOUSLY DESCRIBED A SHELL GUARD THAT NO LONGER EXISTS. It said "hence
      # the +1", named `--shard`, and promised "the guard below costs two lines" — seven lines
      # above a block that opens "NO LOGIC LIVES HERE ANY MORE". `git log -S` confirms `d95908c0`
      # removed both the arithmetic and the guard, and left their description standing. The
      # protection did move correctly into `parse_shard`; the file simply told an editor otherwise,
      # which is the defect PR #366 has produced most often — a sentence truer of the past than of
      # the code beneath it.
      #
      # What actually guards this now, and where to read it: `parse_shard` refuses anything that is
      # not a canonical ASCII `I/N` (bounded to four digits, no Unicode digits, no leading zeros, no
      # surrounding whitespace), refuses `0 <= I < N` violations, and refuses an empty value — each
      # with a CANNOT RUN sentence and a case in `check-plan-code.py`'s own suite.
      - name: Mutation manifest against the delivered scripts (one shard)
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          # ⛔ NO LOGIC LIVES HERE ANY MORE — ROUND 6 M1, AND IT IS WHY THIS ONE GUARD SHIPPED
          # WRONG IN THREE CONSECUTIVE ROUNDS WITH EVERY GATE GREEN. `grep -rln SHARD_INDEX` over
          # `scripts/ tests/ .claude/` returned NOTHING: a `run:` block has no self-test, no
          # mutation entry and no caller, and `check-ratchet-contract`'s population is
          # `scripts/*.{py,sh}` plus `.claude/hooks/*` — never `.github/workflows/`. So every
          # version of the rule written here was unmeasurable by construction:
          #   v1  no I-side check at all -> an absent index became a valid shard 1, all N jobs
          #       measuring one slice and all reporting green      (round 1 M2a, round 5 L2)
          #   v2  a bash `case` on `*[!0-9]*` -> bash arithmetic is FIXED WIDTH, so
          #       18446744073709551616 wrapped to 1                (round 5 codex Low)
          #   v3  a Python parser using `isdigit()` -> UNICODE-WIDE, so `٠` became shard 1
          #                                                        (round 6 L1)
          # The 0->1 conversion now lives in `parse_shard`, which has a suite, mutation entries
          # and ratchet coverage. The workflow interpolates two strings and asserts nothing.
          python3 scripts/check-plan-code.py --mutate . \
            --shard0 "$SHARD_INDEX/$SHARD_TOTAL"

  mutation-sweep-complete:
    # ⭐ ONE CONTEXT TO REQUIRE, WHOSE NAME DOES NOT MOVE WHEN N DOES. A matrix reports N
    # separate contexts (`mutation-sweep (1)` …), so requiring the sweep itself would mean N
    # entries in a repository SETTING and a settings change every time the shard count is
    # retuned — and a required context that stops reporting leaves a pull request PENDING
    # FOREVER, not failed (backlog #137, measured live on PR #314). This job is the stable
    # name to require.
    #
    # ⛔ READ THIS BEFORE MERGING: `verify` no longer runs the sweep, so until
    # `mutation-sweep-complete` is in `required_status_checks.contexts` — a repository
    # setting, which must land AFTER this file and never before it — a surviving mutation
    # reports red and does NOT block the merge button. Nothing in this file can do that for
    # you; say it in the pull request.
    needs: mutation-sweep
    # ⚠ `always()`, so a failed or cancelled matrix still REPORTS. Without it this job is
    # SKIPPED when a shard fails, and a skipped required check is the pending-forever shape
    # this job exists to avoid.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs.<job>.result` over a matrix is the AGGREGATE — `success` only when every shard
      # succeeded — so this cannot pass while a shard is red, cancelled or skipped.
      - name: Every shard of the mutation sweep reported green
        env:
          SWEEP: ${{ needs.mutation-sweep.result }}
        run: |
          if [ "$SWEEP" != "success" ]; then
            echo "FAILED — the sharded mutation sweep reported '$SWEEP', not 'success'."
            echo "A shard that was cancelled or skipped measured NOTHING: treat the mutation"
            echo "evidence for this commit as NOT CHECKED until every shard is green."
            exit 1
          fi
          echo "the mutation sweep is green in every shard"

      # The same pin as every other job in this file. `check-python-pin.py` asks it of jobs
      # that run no Python too, and `EXEMPT_JOBS` is deliberately EMPTY — an empty allow-list
      # is the strongest form, so this is two lines of YAML instead of the first entry in it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
