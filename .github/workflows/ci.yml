# Turns a PR from "a checkpoint you have to read" into "a gate that already ran".
#
# Runs only what needs no external service:
#   - tsc --noEmit           type errors
#   - npm test               2500+ unit/component tests
#   - check:confinement      static guard: service_role stays out of request paths
#
# NOT here: `npm run test:integration` needs a live Supabase stack (see
# tests/integration/setup.ts) and is forced --runInBand; and `test:e2e` needs
# Playwright browsers + a dev server. Both stay local for now — adding the
# Supabase service container is a follow-up, not a blocker for this gate.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 is REQUIRED by the dashboard entry ratchet, which diffs
      # `origin/$GITHUB_BASE_REF...HEAD`. actions/checkout takes depth 1 on the synthesised
      # merge ref, so HEAD is a graft with NO MERGE BASE and the ratchet exits 2 —
      # `fatal: origin/master...HEAD: no merge base`, i.e. CANNOT RUN, i.e. NOT CHECKED.
      # An explicit `git fetch` refspec was tried first: it creates origin/master and leaves
      # that same error, because it fixes the symptom a review reported and not the outcome.
      # Measured: full history is ~0.85s and ~3.7MB over 1,398 commits, and nothing else in
      # this workflow reads git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile (node:22-bookworm-slim) so CI runs the
          # production runtime, not whatever is on the dev machine.
          node-version: '22'
          cache: npm

      # tests/lib/dig/slide-crop.integration.test.ts shells out to real ffmpeg/ffprobe
      # (lib/dig/slide-crop.ts) and has no skip-gate, so `npm test` is not hermetic —
      # it passes on a dev Mac with ffmpeg installed and fails anywhere else. Installing
      # it here FIXES the suite rather than normalising a known-red test into a skip.
      - name: Install ffmpeg (required by the slide-crop tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # --json --outputFile is what makes the counts MEASURABLE rather than asserted: the next step
      # compares the roadmap's stated numbers against this file. Without it, the roadmap's
      # "2703 unit / 267 suites" is a claim nobody re-reads, and it had already drifted to 2690.
      - name: Unit and component tests
        run: npm test -- --ci --json --outputFile=jest-results.json

      # The roadmap states the size of the safety net. This makes that statement fail when it drifts.
      # Deliberately AFTER the suite and reading its real output — a counts check that cannot see the
      # run is a green tick over nothing, so scripts/check-test-counts.py exits non-zero when the
      # results file is absent, malformed, or reports a failed run.
      - name: Roadmap test counts match the suite
        run: python3 scripts/check-test-counts.py --results jest-results.json

      - name: check-test-counts self-test
        run: python3 scripts/check-test-counts.py --self-test

      - name: service_role confinement guard
        run: npm run check:confinement

      # ADR index drift, dangling ADR references, broken living-doc links.
      # Also prints an advisory list of spec decisions never promoted to an ADR.
      - name: Documentation integrity
        run: python3 scripts/check-docs.py

      # Ratchet on the 2026-07-30 architecture-review findings. Reports progress toward
      # each target; FAILS only when a metric gets worse than its baseline.
      #
      # This is the only thing that would notice finding #1 growing from 12 forked route
      # files to 15 — no test fails and no type breaks when a 13th route copy-pastes the
      # STORAGE_BACKEND branch. Criteria: docs/reviews/architecture-findings-acceptance.md
      - name: Architecture findings ratchet
        run: python3 scripts/check-arch-findings.py

      # Ratchet on gate items that never say what would FAIL them.
      #
      # M1.4's B5 asked a STATIC script to "pass against the real deployed environment" — it has no
      # env, no fetch, no network, so it emitted identical output everywhere and could only ever
      # pass. A guard that passes in both worlds, except the guard was a SENTENCE, which is why
      # every other instrument here missed it: they all inspect code, none inspects a gate.
      #
      # Ratchet, not a hard gate: 13 existing items lack a `FAILS IF:` clause and a big-bang
      # failure would just get switched off. This stops the NEXT one.
      - name: Gate falsifiability ratchet
        run: python3 scripts/check-gate-falsifiability.py

      # The roadmap's ▶ NEXT ACTIONS block must not name work whose checkbox is already ticked.
      # Three occurrences: it called M1.3 "the single remaining blocker" for nine days after M1.3
      # was ticked (2026-07-30), then named the B-group as the next step in the same commit range
      # that closed them (2026-08-11). Both times the file was actively maintained — which is why
      # the recency check originally proposed for this was rejected: it reads green throughout.
      # dev-process.md:102 already requires the tick and the summary to ship together; a rule broken
      # twice by people who know it is a rule that wants to be a script.
      - name: Roadmap internal consistency
        run: python3 scripts/check-roadmap-consistency.py

      # A review round has two halves, or a written reason why it does not. `docs/plugins.md` has
      # required both since June; nothing enforced it, and on 2026-08-24 the M4 plan went two rounds
      # with only the Codex half. It does NOT block when a reviewer genuinely cannot run — the
      # documented fallback already writes a review plus a recorded gap, which is what this asserts.
      - name: Review rounds have both halves
        run: python3 scripts/check-review-rounds.py

      - name: check-review-rounds self-test
        run: python3 scripts/check-review-rounds.py --self-test

      # A feature's documents must say which GOAL they belong to, by a name that survives a rename.
      # Written after an hour was lost re-deriving a roadmap that existed: the feature spans three
      # vocabularies after two honest renames, and membership by keyword returns 7 of 162 specs and
      # plans while missing one the roadmap names in its own fifth line. A convention would catch
      # what someone reads; this catches what is there (ADR-0010).
      - name: Anchor headers
        run: python3 scripts/check-anchors.py

      - name: check-anchors self-test
        run: python3 scripts/check-anchors.py --self-test

      # The ratchets' own contract, enforced rather than described. Written because the prose in
      # docs/process-checklists.md said "there are three ratchets" — from memory, and wrong by half;
      # this script found six. It checks the two rules that are statically decidable (a --self-test
      # exists; no `except` handler returns 0) and states plainly that it does not check the rest.
      - name: Ratchet contract
        run: python3 scripts/check-ratchet-contract.py

      # ⚠ THE THREE GUARDS THAT NOTHING EXECUTED, wired 2026-08-30 by Phase 6.
      # Each was on disk, each had a --self-test, each exits 0 — and no CI step,
      # gate script or hook ran any of them. `check-producer-enumeration.py` was
      # additionally listed in docs/dev-process.md under the heading "What is
      # mechanically enforced". They are steps rather than one combined command
      # so a failure names the guard that failed.
      #
      # This is the R3 arm of the ratchet contract closing on itself: the step
      # above now REFUSES a guard with no caller, so removing any line below
      # turns that step red rather than quietly shrinking coverage.
      - name: Explainer delivery is described in ONE place
        run: python3 scripts/check-explainer-delivery.py

      - name: Plan task order
        run: python3 scripts/check-plan-task-order.py

      - name: Producer enumeration matches the defining expression
        run: python3 scripts/check-producer-enumeration.py

      # A money guard lives three files away from a grant that does not know it holds it up. The
      # serve path spends on `tryGet -> absent`, which on Supabase means absent OR RLS-denied; it is
      # safe only because the caller already read the markdown from the same folder, and that is
      # evidence about the model ONLY while one grant covers both keys (ADR-0008). A comment in the
      # migration would leave with the edit it should have stopped — so the grant is pinned instead.
      - name: Storage grant pin (ADR-0008)
        run: python3 scripts/check-storage-grant-pin.py

      # Backlog #54 half (a), PREVENTION — after the mechanism that row specifies was MEASURED not
      # to work. PostgreSQL grants EXECUTE on a new function to PUBLIC, and `alter default
      # privileges` CANNOT remove it: stored entries are ADDITIVE to the built-in default (three
      # scratch-database setups, 2026-08-28, all left `=X/postgres` on the created function). So
      # `revoke execute on functions from anon` closes one of two routes and the other cannot be
      # closed at that layer at all — and it would have PASSED on production, whose default ACL
      # happens to carry no PUBLIC entry, while being wrong everywhere else.
      # What actually keeps prod clean is 41 individual `revoke ... from public` statements, one
      # per migration — a convention, i.e. every author remembering. This is the mechanism for it.
      # Static (reads .sql text, no database), which is why it runs here and not with the schema
      # gates.
      - name: Every new public function revokes PUBLIC
        run: python3 scripts/check-function-revokes.py

      - name: check-function-revokes self-test
        run: python3 scripts/check-function-revokes.py --self-test

      # ── The project dashboard: the page, its grammar, and the gate that feeds it ──
      #
      # A person who was away reads this page instead of the transcript. It is only worth
      # reading while entries keep being written, which is what the ratchet below enforces.

      - name: gen-dashboard self-test
        run: python3 scripts/gen-dashboard.py --self-test

      - name: check-dashboard-entry self-test
        run: python3 scripts/check-dashboard-entry.py --self-test

      # The mutation manifest runs against the DELIVERED scripts. It replaced a step that
      # required byte-identity between these files and a 3,170-line planning document —
      # backlog #70, retired 2026-08-29 once this existed and both paths were shown green
      # at 43 mutations / 0 survivors on the same tree.
      #
      # ⚠ That 43 is HISTORY — it pins the one-off equivalence demonstration, not the live
      # count, which has since grown (a 44th entry closed a fail-open found in review). For
      # the current number run the step; EXPECTED_MUTATIONS in check-plan-code.py is what
      # actually enforces it. Do not restate a live count here — see ff5857b.
      #
      # What this protects is unchanged from the step it replaces: the mutation evidence
      # describes the code that ships. It is now literally true rather than true-by-copy.
      #
      # ⚠ The coupling is REDUCED, not gone: 1,541 lines of byte-identity become 45 exact
      # source anchors (~3%), which is inherent to anchor-based mutation testing. Measured
      # over PR #175's five commits — +166/-14 lines, zero anchors disturbed.
      #
      # FAILS IF: a mutation survives · an anchor is missing or ambiguous · a suite times
      # out (CANNOT RUN, never a catch) · the control is red before any mutation is applied
      # · a manifest's count differs from EXPECTED_MUTATIONS in EITHER direction (adding a
      #   mutation is also a visible act) · a manifest repeats a mutation name or edit anchor,
      #   which would keep the count while narrowing real coverage.
      - name: Mutation manifest against the delivered scripts
        run: python3 scripts/check-plan-code.py --mutate .

      # The ratchet runs in CI; until now its own tests did not. Same reason every other
      # ratchet here has a --self-test step: a guard whose tests are developer-machine-only
      # can rot without anything noticing.
      - name: check-plan-code self-test
        run: python3 scripts/check-plan-code.py --self-test

      # The gate itself. Needs the merge base, hence fetch-depth: 0 on the checkout.
      # BODY goes through env and then a FILE — never interpolated into the shell —
      # because a PR body is attacker-controlled text full of backticks and quotes.
      - name: dashboard entry ratchet
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > /tmp/pr-body.md
          python3 scripts/check-dashboard-entry.py \
            --base "origin/$GITHUB_BASE_REF" --pr-body-file /tmp/pr-body.md
