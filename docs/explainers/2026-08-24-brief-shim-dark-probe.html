<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shim dark probe</title>

<style>:root{
  --bg:#f7f5f1; --card:#fcfaf7; --raise:#f0ebe3; --pill:#e9e4db;
  --fg:#42403a; --fg2:#605c55; --fg3:#8a857c; --strong:#26241f;
  --rule:#e2dcd2; --hair:#ece7de;
  --h:#26241f;
  --accent:#8a5a2b; --accent-bg:#f4ece2;
  --verified:#3d6b4c; --verified-br:#c4d9ca; --verified-bg:#eff5f0;
  --danger:#8f4444; --danger-br:#e2c8c8; --danger-bg:#f9f0ef;
  --warn:#7c6426; --warn-br:#ded2a9; --warn-bg:#f8f2e2;
  --code:#e9e4db; --code-fg:#4d4842;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ink:#42403a; --ink-soft:#605c55; --ink-faint:#8a857c; --structure:#e2dcd2;
  --good:#3d6b4c; --defect:#8f4444; --em:#26241f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191817; --card:#201f1d; --raise:#272523; --pill:#2b2926;
  --fg:#c5c1b9; --fg2:#a4a099; --fg3:#7e7a72; --strong:#eae6de;
  --rule:#332f2b; --hair:#2a2825;
  --h:#eae6de;
  --accent:#cb9a68; --accent-bg:#26211c;
  --verified:#8bb99b; --verified-br:#33503d; --verified-bg:#1b2220;
  --danger:#c98f8f; --danger-br:#4e3232; --danger-bg:#241d1d;
  --warn:#c4ab72; --warn-br:#4b4227; --warn-bg:#231f18;
  --code:#2b2926; --code-fg:#c0bbb2;
  --ink:#c5c1b9; --ink-soft:#a4a099; --ink-faint:#7e7a72; --structure:#332f2b;
  --good:#8bb99b; --defect:#c98f8f; --em:#eae6de;
}}
:root[data-theme="dark"]{
  --bg:#191817; --card:#201f1d; --raise:#272523; --pill:#2b2926;
  --fg:#c5c1b9; --fg2:#a4a099; --fg3:#7e7a72; --strong:#eae6de;
  --rule:#332f2b; --hair:#2a2825;
  --h:#eae6de;
  --accent:#cb9a68; --accent-bg:#26211c;
  --verified:#8bb99b; --verified-br:#33503d; --verified-bg:#1b2220;
  --danger:#c98f8f; --danger-br:#4e3232; --danger-bg:#241d1d;
  --warn:#c4ab72; --warn-br:#4b4227; --warn-bg:#231f18;
  --code:#2b2926; --code-fg:#c0bbb2;
  --ink:#c5c1b9; --ink-soft:#a4a099; --ink-faint:#7e7a72; --structure:#332f2b;
  --good:#8bb99b; --defect:#c98f8f; --em:#eae6de;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.74 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:.002em}
.wrap{max-width:840px;margin:0 auto;padding:0 24px 130px}

/* SIZE carries hierarchy. Headings are LIGHTER than body-bold, not heavier. */
h1{font-size:clamp(28px,4.4vw,38px);line-height:1.2;margin:0 0 12px;font-weight:450;
   letter-spacing:-.017em;color:var(--h)}
h2{font-size:26px;line-height:1.28;margin:60px 0 6px;font-weight:450;letter-spacing:-.012em;
   color:var(--h);scroll-margin-top:16px}
h2 .n{color:var(--fg3);font-weight:400;font-variant-numeric:tabular-nums;margin-right:.5em}
h3{font-size:18px;margin:32px 0 6px;font-weight:600;color:var(--h);letter-spacing:-.004em}
h4{font-size:17px;font-weight:600;color:var(--h);margin:0 0 6px}
h1 strong,h2 strong,h3 strong,h4 strong{color:inherit;font-weight:inherit}

/* BOLD IS A LABEL, NOT A SHOUT — weight only, a neutral tone, never a hue */
strong,b{font-weight:600;color:var(--strong)}
em{font-style:italic;color:var(--fg2)}

p{margin:14px 0}
.lede{color:var(--fg2);font-size:17px;margin-top:9px}
.sub{color:var(--fg3);font-size:15px;margin:0}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
   font-weight:600;margin:0 0 14px}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2.5px}
header.top{padding-block:56px 28px;border-bottom:1px solid var(--rule);margin-bottom:34px}

/* TERMINAL TEXTURE — inline code is a raised pill, and it carries the visual variety */
code{font:.865em/1.5 var(--mono);background:var(--pill);color:var(--code-fg);
  padding:.2em .48em;border-radius:6px;letter-spacing:-.01em;white-space:nowrap}
pre{background:var(--code);border:1px solid var(--hair);border-radius:9px;padding:15px 17px;
  overflow-x:auto;white-space:pre;margin:18px 0}
pre code{background:none;padding:0;font-size:13.5px;line-height:1.7;display:block;
  color:var(--code-fg);white-space:pre}

table{border-collapse:collapse;width:100%;margin:20px 0;font-size:15.5px}
.scroll{overflow-x:auto;margin:20px 0}.scroll table{margin:0}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3);font-weight:600;
  border-bottom:1px solid var(--rule)}

.card{background:var(--card);border:1px solid var(--hair);border-radius:11px;padding:18px 22px;margin:22px 0}
.box{border-left:3px solid;border-radius:0 9px 9px 0;padding:15px 20px;margin:22px 0}
.box p:first-child{margin-top:0}.box p:last-child{margin-bottom:0}
.box.bad{border-color:var(--danger);background:var(--danger-bg)}
.box.ok{border-color:var(--verified);background:var(--verified-bg)}
.box.warn{border-color:var(--warn);background:var(--warn-bg)}
.box.acc{border-color:var(--accent);background:var(--accent-bg)}
.box .lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  display:block;margin-bottom:7px}
.bad .lbl{color:var(--danger)} .ok .lbl{color:var(--verified)}
.warn .lbl{color:var(--warn)} .acc .lbl{color:var(--accent)}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;
  border:1px solid;letter-spacing:.02em;white-space:nowrap}
.pill.no{color:var(--danger);border-color:var(--danger-br);background:var(--danger-bg)}
.pill.yes{color:var(--verified);border-color:var(--verified-br);background:var(--verified-bg)}
.pill.mid{color:var(--warn);border-color:var(--warn-br);background:var(--warn-bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}
@media (max-width:660px){.two{grid-template-columns:1fr}}
ul,ol{padding-left:24px;margin:14px 0} li{margin:10px 0}
li::marker{color:var(--fg3)}
.note{color:var(--fg3);font-size:14.5px}
.hr{height:1px;background:var(--rule);margin:52px 0;border:0}
.q{background:var(--card);border:1px solid var(--hair);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:17px 22px;margin:20px 0}
.big{font-variant-numeric:tabular-nums;font-weight:600;font-size:19px}
:root { --verified: var(--good, #2f7d63); --verified-br: var(--good, #2f7d63);
          --fg3: var(--ink-faint, #7a8695); --fg2: var(--ink-soft, #4a5563);
          --fg: var(--ink, #151b23); --bg2: var(--card, #fff); }
  html { --rule: #d3d9e2; --bg: #ffffff; --good: #2f7d63; --defect: #a3323c;
         --structure: #33607a; --structure-br: #33607a; --structure-bg: #eaf0f4; }
  /* Older names the CIRCULATING tray still reads. They are part of its de-facto contract, not any
     one page's invention — every recent fragment has been re-declaring them privately to get past
     assert_shimmed, which is the shim under-covering rather than the pages being wrong. Aliased to
     the canonical name so there is still ONE source per concept. */
  :root { --ink-3: var(--ink-faint, #7a8695); --line: var(--rule, #d3d9e2);
          --structural: var(--structure, #33607a);
          --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* Dark defaults for a fragment that declares NO palette. On `html` (specificity 0,0,1) so any
     fragment `:root` (0,1,0) still wins in both directions. A fragment that declares a LIGHT-only
     palette in `:root` overrides this and stays light — it asked for that; the shim only supplies
     what nobody supplied. */
  @media (prefers-color-scheme: dark) {
    html { --rule: #38353f; --bg: #16151a; --card: #1d1c22; --ink: #eceaf0;
           --ink-soft: #c8c5cf; --ink-faint: #928e9c; --good: #6fcf9a; --defect: #f0937c;
           --structure: #82b4ee; --structure-br: #2b4666; --structure-bg: #131f2e; }
  }
  /* PAINT THE PAGE. Nothing did, and `--bg` above was therefore decoration: a fragment that did
     not set its own body background composed to the browser default white with black text, while
     its cards were correctly dark. MEASURED 2026-08-24.
     `:where()` contributes ZERO specificity, which is the whole reason this is safe to add — SHIM
     is concatenated AFTER the fragment's CSS, so a normal `body{…}` rule here would override every
     page that already paints itself. This one is always losable. */
  :where(html, body) { background: var(--bg); color: var(--fg); }

/* ---- Ask tray, extracted verbatim ---- */
/* ---- Ask tray, extracted verbatim ---- */
/* ---- Ask tray, extracted verbatim ---- */
/* ── THE ASK BOX ─────────────────────────────────────────────────────────────────────────────
   MEASURED 2026-08-22 on the served page: `#qbox` computed `color: rgb(231,233,238)` over
   `background: rgb(255,255,255)` — near-white text on a white field, reported as "font color is
   too light". The tray is LIFTED verbatim by brief-compose.py and spliced AFTER this block, so a
   plain `#qbox` rule here loses the cascade; two ids win without touching the lifted code.
   Both sides are pinned, because fixing only the colour leaves the pair theme-dependent. */
#tray #qbox{color:var(--ink);background:var(--card);border-color:var(--line);
     caret-color:var(--ink);-webkit-text-fill-color:var(--ink)}
#tray #qbox::placeholder{color:var(--ink-3);opacity:1;-webkit-text-fill-color:var(--ink-3)}
#tray #qbox:focus{outline:2px solid var(--structural);outline-offset:1px}
/* The badge and the ⚠ flag are SIBLINGS of the h3, never children of it — the Ask tray reads a
   heading by walking its childNodes and skipping only `.askbtn`, so anything else living inside
   an h3 is silently prepended to the question the reader sends. That exact defect is recorded in
   the explain-diff skill ("…had never workedask"); putting a badge in there would reintroduce it
   under a new class name. */
.titleline{display:flex;align-items:baseline;gap:.45rem;margin-bottom:.35rem}
/* ---- Ask tray, extracted verbatim ---- */
/* ── THE ASK BOX ─────────────────────────────────────────────────────────────────────────────
   MEASURED 2026-08-22 on the served page: `#qbox` computed `color: rgb(231,233,238)` over
   `background: rgb(255,255,255)` — near-white text on a white field, reported as "font color is
   too light". The tray is LIFTED verbatim by brief-compose.py and spliced AFTER this block, so a
   plain `#qbox` rule here loses the cascade; two ids win without touching the lifted code.
   Both sides are pinned, because fixing only the colour leaves the pair theme-dependent. */
#tray #qbox{color:var(--ink);background:var(--card);border-color:var(--line);
     caret-color:var(--ink);-webkit-text-fill-color:var(--ink)}
#tray #qbox::placeholder{color:var(--ink-3);opacity:1;-webkit-text-fill-color:var(--ink-3)}
#tray #qbox:focus{outline:2px solid var(--structural);outline-offset:1px}
/* The badge and the ⚠ flag are SIBLINGS of the h3, never children of it — the Ask tray reads a
   heading by walking its childNodes and skipping only `.askbtn`, so anything else living inside
   an h3 is silently prepended to the question the reader sends. That exact defect is recorded in
   the explain-diff skill ("…had never workedask"); putting a badge in there would reintroduce it
   under a new class name. */
.titleline{display:flex;align-items:baseline;gap:.45rem;margin-bottom:.35rem}
/* ---- Ask tray, extracted verbatim ---- */
/* ask tray */
.askbtn{position:absolute;font-family:var(--sans);font-size:.66rem;padding:.1rem .42rem;
  border:1px solid var(--rule);border-radius:20px;background:var(--bg2);color:var(--fg3);cursor:pointer}
.askbtn:hover{color:var(--structure);border-color:var(--structure)}
#tray{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:2px solid var(--structure);
  padding:.85rem 1rem;transform:translateY(105%);transition:transform .16s;z-index:50;
  font-family:var(--sans);box-shadow:0 -6px 24px rgba(0,0,0,.13)}
#tray.on{transform:translateY(0)}
#tray .in{max-width:53rem;margin:0 auto}
#qt{font-size:.78rem;color:var(--fg3);margin-bottom:.4rem;line-height:1.4}
#qbox{width:100%;font-family:var(--sans);font-size:.9rem;padding:.5rem .6rem;border-radius:6px;
  border:1px solid var(--rule);background:var(--bg);color:var(--fg);resize:vertical;min-height:3.1rem}
#sentnote{font-size:.78rem;color:var(--verified)}
#sentnote.err{color:var(--defect)}
#modechip{font-family:var(--sans);font-size:.68rem;padding:.1rem .45rem;border:1px solid var(--rule);
  border-radius:20px;margin-left:.4rem;white-space:nowrap}
</style>
</head>
<body>

<div class="t"><h1>Bare</h1><p>This fragment sets no colours and no body background.</p>
<div class="card">A card using only shim variables.</div></div>

<div id="tray"><div class="in">
  <div id="qt"></div>
  <textarea id="qbox" placeholder="Ask about this section — it goes straight to the session."></textarea>
  <div class="trow">
    <button id="sendbtn" type="button">Send</button>
    <button id="closebtn" type="button">Close</button>
    <span id="sentnote"></span>
  </div>
</div>
<script>
(function(){
  "use strict";
  var LIVE = location.protocol === 'http:' || location.protocol === 'https:';
  var chip = document.getElementById('modechip');
  if (chip) {
    chip.textContent = LIVE ? '● live — Send works' : '○ local file — Send unavailable, copies instead';
    chip.style.color = LIVE ? 'var(--verified)' : 'var(--fg3)';
    chip.style.borderColor = LIVE ? 'var(--verified-br)' : 'var(--rule)';
  }

  var tray = document.getElementById('tray'),
      qbox = document.getElementById('qbox'),
      qt   = document.getElementById('qt'),
      note = document.getElementById('sentnote'),
      sendbtn = document.getElementById('sendbtn'),
      closebtn = document.getElementById('closebtn');
  var ctxSection = '', ctxQuote = '';

  if (!LIVE) { sendbtn.textContent = 'Copy'; }

  // The ask button is a CHILD of the heading, so textContent swallows its label — measured during
  // verification: a question arrived tagged "…had never workedask". Read the heading without it.
  function headingText(h){
    var out = '';
    Array.prototype.forEach.call(h.childNodes, function(n){
      if (n.nodeType === 1 && n.classList && n.classList.contains('askbtn')) return;
      out += n.textContent;
    });
    return out.trim();
  }

  function nearestHeading(node){
    var el = node && node.nodeType === 3 ? node.parentNode : node;
    while (el && el !== document.body){
      var p = el.previousElementSibling;
      while (p){
        if (/^H[1-4]$/.test(p.tagName)) return headingText(p);
        p = p.previousElementSibling;
      }
      el = el.parentNode;
    }
    return '';
  }

  function openTray(section, quote){
    ctxSection = section || '(no section)';
    ctxQuote = quote || '';
    qt.innerHTML = '<b>' + escapeHtml(ctxSection) + '</b>' +
      (ctxQuote ? ' — “' + escapeHtml(ctxQuote.slice(0,180)) + (ctxQuote.length>180?'…':'') + '”'
                : ' — nothing highlighted');
    note.textContent = ''; note.className = '';
    tray.classList.add('on');
    qbox.focus();
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Hover-a-heading → ask button
  Array.prototype.forEach.call(document.querySelectorAll('h2, h3'), function(h){
    var b = document.createElement('button');
    b.className = 'askbtn'; b.type = 'button'; b.textContent = 'ask';
    b.style.right = '0'; b.style.top = '.85rem'; b.style.opacity = '0';
    b.style.transition = 'opacity .12s';
    h.appendChild(b);
    h.addEventListener('mouseenter', function(){ b.style.opacity = '1'; });
    h.addEventListener('mouseleave', function(){ b.style.opacity = '0'; });
    b.addEventListener('focus', function(){ b.style.opacity = '1'; });
    b.addEventListener('click', function(e){
      e.preventDefault();
      openTray(headingText(h), '');
    });
  });

  // Selection → floating ask button
  var floater = null;
  document.addEventListener('mouseup', function(){
    setTimeout(function(){
      var sel = window.getSelection();
      if (floater) { floater.remove(); floater = null; }
      if (!sel || sel.isCollapsed) return;
      var text = sel.toString().trim();
      if (text.length < 3) return;
      var r = sel.getRangeAt(0).getBoundingClientRect();
      floater = document.createElement('button');
      floater.className = 'askbtn'; floater.type = 'button'; floater.textContent = 'ask';
      floater.style.position = 'fixed';
      floater.style.left = Math.max(8, Math.min(window.innerWidth - 70, r.left)) + 'px';
      floater.style.top  = Math.max(8, r.top - 30) + 'px';
      var section = nearestHeading(sel.anchorNode);
      floater.addEventListener('mousedown', function(e){ e.preventDefault(); });
      floater.addEventListener('click', function(){
        openTray(section, text);
        if (floater) { floater.remove(); floater = null; }
      });
      document.body.appendChild(floater);
    }, 10);
  });

  function compose(){
    // The exact shape the session's monitor parses: section line, quote line, question line.
    return '**' + ctxSection + '**\n' +
           '   > ' + (ctxQuote ? ctxQuote.replace(/\s+/g,' ').slice(0,400) : '(nothing highlighted)') + '\n' +
           '   Q: ' + qbox.value.trim();
  }

  function send(){
    var q = qbox.value.trim();
    if (!q) { note.className = 'err'; note.textContent = 'Type a question first.'; return; }
    var body = compose();
    if (!LIVE){
      if (navigator.clipboard) {
        navigator.clipboard.writeText(body).then(function(){
          note.className = ''; note.textContent = 'Copied to clipboard — paste it into the session.';
        }, function(){
          note.className = 'err'; note.textContent = 'Could not copy. Select the text manually.';
        });
      } else {
        note.className = 'err'; note.textContent = 'No clipboard here — copy your question manually.';
      }
      return;
    }
    sendbtn.disabled = true;
    note.className = ''; note.textContent = 'Sending…';
    fetch('/questions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ doc: location.pathname.replace(/^\//,'') || 'latest', text: body })
    }).then(function(r){
      sendbtn.disabled = false;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      note.className = '';
      note.textContent = '✓ Sent. The session is watching questions.md — if nothing comes back, say “read my questions”.';
      qbox.value = '';
    }).catch(function(e){
      sendbtn.disabled = false;
      note.className = 'err';
      note.textContent = 'Send failed (' + e.message + '). Is the server still running? python3 scripts/explainer-serve.py';
    });
  }

  sendbtn.addEventListener('click', send);
  closebtn.addEventListener('click', function(){ tray.classList.remove('on'); });
  qbox.addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
    if (e.key === 'Escape') tray.classList.remove('on');
  });
})();
</script>
</body></html>
